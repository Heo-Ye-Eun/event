<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔍 서버 분석 도구</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            color: white;
        }
        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 50px;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.37);
            max-width: 800px;
        }
        .button {
            background: linear-gradient(45deg, #FF6B6B, #FF8E53);
            border: none;
            padding: 15px 30px;
            border-radius: 25px;
            color: white;
            font-size: 1.1em;
            cursor: pointer;
            margin: 10px;
            transition: transform 0.3s;
        }
        .button:hover {
            transform: scale(1.05);
        }
        #result {
            background: rgba(0, 0, 0, 0.3);
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
            text-align: left;
            font-family: monospace;
            max-height: 400px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 서버 분석 도구</h1>
        <p>실제 form 구조와 필요한 파라미터를 분석합니다</p>
        
        <button class="button" onclick="analyzeLoginForm()">
            🔐 로그인 폼 분석
        </button>
        
        <button class="button" onclick="analyzeProfilePage()">
            👤 프로필 페이지 분석
        </button>
        
        <button class="button" onclick="analyzeGiftForm()">
            🎁 선물 폼 분석
        </button>
        
        <button class="button" onclick="testCSRFBypass()">
            ⚡ CSRF 우회 테스트
        </button>
        
        <div id="result"></div>
    </div>

    <script>
        function analyzeLoginForm() {
            showResult('🔐 로그인 폼 분석 중...');
            
            // 로그인 페이지의 실제 form 구조 확인
            fetch('http://3.36.66.216/login.php')
                .then(response => response.text())
                .then(html => {
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(html, 'text/html');
                    const forms = doc.getElementsByTagName('form');
                    
                    let result = '📋 로그인 폼 구조:\n\n';
                    for (let form of forms) {
                        result += `Action: ${form.action}\n`;
                        result += `Method: ${form.method}\n`;
                        result += 'Fields:\n';
                        
                        const inputs = form.getElementsByTagName('input');
                        for (let input of inputs) {
                            result += `  - ${input.name}: ${input.type} (value: ${input.value})\n`;
                        }
                        result += '\n';
                    }
                    
                    showResult(result);
                })
                .catch(err => {
                    showResult('❌ CORS 에러: ' + err.message + '\n\n대안: 브라우저에서 직접 확인 필요');
                });
        }
        
        function analyzeProfilePage() {
            showResult('👤 프로필 페이지 분석 중...');
            
            // 실제 선물 보내기 form 분석
            const testUrl = 'http://3.36.66.216/profile.php';
            
            // iframe으로 페이지 로드해서 분석
            const iframe = document.createElement('iframe');
            iframe.style.display = 'none';
            iframe.src = testUrl;
            
            iframe.onload = function() {
                try {
                    const doc = iframe.contentDocument;
                    const forms = doc.getElementsByTagName('form');
                    
                    let result = '🎁 선물 폼 구조:\n\n';
                    for (let form of forms) {
                        result += `Action: ${form.action}\n`;
                        result += `Method: ${form.method}\n`;
                        result += 'Fields:\n';
                        
                        const inputs = form.getElementsByTagName('input');
                        for (let input of inputs) {
                            if (input.name) {
                                result += `  - ${input.name}: ${input.type} (value: ${input.value})\n`;
                            }
                        }
                        result += '\n';
                    }
                    
                    showResult(result);
                } catch (e) {
                    showResult('❌ 크로스 오리진 접근 차단\n\n수동 확인 방법:\n1. http://3.36.66.216에 로그인\n2. 개발자 도구 > Elements 탭\n3. 선물 보내기 form 구조 확인');
                }
            };
            
            document.body.appendChild(iframe);
            
            setTimeout(() => {
                if (iframe.parentNode) {
                    iframe.parentNode.removeChild(iframe);
                }
            }, 5000);
        }
        
        function analyzeGiftForm() {
            showResult('🎁 선물 폼 매개변수 분석...\n\n예상되는 필수 필드들:');
            
            const expectedFields = [
                'receiver_id - 받을 사람 ID',
                'points - 포인트 수량', 
                'send_gift - 선물 전송 플래그',
                'gift_type - 선물 종류',
                'message - 메시지',
                'csrf_token - CSRF 토큰 (있을 가능성)',
                'submit - 전송 버튼'
            ];
            
            let result = '📋 예상 필드 목록:\n\n';
            expectedFields.forEach(field => {
                result += `• ${field}\n`;
            });
            
            result += '\n🔍 실제 확인 방법:\n';
            result += '1. 사이트에 로그인\n';
            result += '2. 선물 보내기 form에서 F12 개발자 도구\n';
            result += '3. Network 탭에서 실제 전송 데이터 확인\n';
            
            showResult(result);
        }
        
        function testCSRFBypass() {
            showResult('⚡ CSRF 우회 기법 테스트 중...');
            
            // 다양한 우회 기법들 시도
            const techniques = [
                'Referer 헤더 조작',
                'Origin 헤더 우회', 
                'Content-Type 변경',
                'GET 메소드 시도',
                'JSON 형식 전송',
                'Multipart 형식 시도'
            ];
            
            let result = '🛠️ 시도 가능한 우회 기법들:\n\n';
            techniques.forEach((tech, i) => {
                result += `${i+1}. ${tech}\n`;
            });
            
            result += '\n💡 권장 순서:\n';
            result += '1. 먼저 실제 form 구조 파악\n';
            result += '2. CSRF 토큰 존재 여부 확인\n';
            result += '3. 필수 필드 정확히 매핑\n';
            result += '4. 단순한 GET 요청부터 시도\n';
            
            showResult(result);
        }
        
        function showResult(text) {
            const resultDiv = document.getElementById('result');
            resultDiv.textContent = text;
            resultDiv.scrollTop = resultDiv.scrollHeight;
        }
        
        console.log('🔍 서버 분석 도구 준비됨');
        console.log('💡 실제 form 구조를 파악하여 정확한 공격 수행');
    </script>
</body>
</html>
